<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bella Joias — Produto</title>
<link rel="stylesheet" href="Principal.css" />
<link rel="stylesheet" href="componentes.css" />
<link rel="stylesheet" href="PrincipalPublica.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
</head>
<body>
  <header class="store-nav">
    <div class="store-logo"><i class="ti ti-diamond"></i><span class="logo-name">Bella Joias</span></div>
    <div class="nav-actions" style="gap:12px;">
      <a class="section-link" href="index.html">Voltar à loja</a>
      <button class="nav-admin-btn" onclick="location.href='admin.html'">Painel</button>
    </div>
  </header>

  <section class="store-section" style="display:flex; justify-content:center; align-items:center; min-height:calc(100vh - 90px); padding-top:40px; padding-bottom:40px;">
    <article class="product-preview-card" style="max-width:360px; width:100%;">
      <div class="preview-img"><i class="ti ti-ring preview-img-icon"></i></div>
      <div class="preview-info">
        <div class="preview-name">Anel solitário rosê</div>
        <div class="preview-desc">Anel com banho rosê, design minimalista e acabamento premium. Perfeito para presentes e ocasiões especiais.</div>
        <div class="preview-prices">
          <div class="retail-price">R$ 89,90</div>
          <div class="wholesale-price">Preço atacado R$ 59,90</div>
          <div class="profit-line">Margem de revenda +31%</div>
        </div>
        <div class="preview-stock"><i class="ti ti-stack"></i> 24 unidades em estoque</div>
        <button class="btn-full">Adicionar ao carrinho</button>
        <button class="btn btn-secondary" style="width:100%; margin-top:12px;">Ver mais produtos</button>
      </div>
    </article>
  </section>
</body>
</html>
