name: Deploy LaPink para GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v4

      # Espelha a mesma estrutura servida pelo Firebase Hosting (raiz do
      # repo = admin/ + public/ como irmãos), excluindo o que o firebase.json
      # também ignora: código-fonte das Functions, dependências, dados
      # internos e arquivos que não fazem parte do site.
      - name: Montar site (espelha o ignore do firebase.json)
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.claude' \
            --exclude='.firebase' \
            --exclude='_site' \
            --exclude='node_modules' \
            --exclude='functions' \
            --exclude='data' \
            --exclude='screenshots' \
            --exclude='*.md' \
            --exclude='*.log' \
            --exclude='.env' \
            --exclude='firebase.json' \
            --exclude='.firebaserc' \
            --exclude='firestore.rules' \
            --exclude='firestore.rules.secure' \
            --exclude='firestore.indexes.json' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='dev-server.js' \
            --exclude='serve.js' \
            --exclude='verify.js' \
            --exclude='verify_with_server.js' \
            --exclude='check_getsession.js' \
            --exclude='lapink-insomnia.json' \
            ./ ./_site/

      # Redirect da raiz só para este mirror (GitHub Pages não tem "rewrites"
      # como o firebase.json). Gerado aqui, direto na pasta de publicação —
      # nunca fica commitado no repo nem entra no deploy do Firebase, que já
      # resolve "/" → "/public/V1.html" pelo próprio rewrite nativo dele.
      - name: Gerar redirect da raiz (só para o Pages)
        run: |
          cat > ./_site/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="pt-BR">
          <head>
          <meta charset="UTF-8" />
          <meta http-equiv="refresh" content="0; url=public/V1.html" />
          <link rel="canonical" href="public/V1.html" />
          <script>location.replace('public/V1.html' + location.search);</script>
          </head>
          <body><p>Redirecionando… <a href="public/V1.html">Clique aqui</a> se não for automático.</p></body>
          </html>
          HTML

      - name: Upload artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy para GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
