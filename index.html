<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LaPink — Loja</title>
<meta name="robots" content="noindex" />
<!-- Redirect só para o mirror do GitHub Pages: no Firebase Hosting o
     firebase.json já reescreve "/" para "/public/V1.html" direto. Este
     arquivo existe para a raiz funcionar igual quando servida sem rewrites
     (GitHub Pages, ou abrindo os arquivos estáticos direto). -->
<meta http-equiv="refresh" content="0; url=public/V1.html" />
<link rel="canonical" href="public/V1.html" />
<script>
  try {
    var qs = window.location.search || '';
    window.location.replace('public/V1.html' + qs);
  } catch (e) {
    window.location.href = 'public/V1.html';
  }
</script>
<style>
  body{font-family:system-ui,Segoe UI,Arial,sans-serif;background:#FFF0F7;color:#D4537E;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;}
  a{color:#D4537E;}
</style>
</head>
<body>
  <p>Redirecionando para a loja… <a href="public/V1.html">Clique aqui</a> se não for automático.</p>
</body>
</html>
