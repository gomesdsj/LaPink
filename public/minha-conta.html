<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LaPink — Minha Conta</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-init.js"></script>
<script src="js/cloud-sync.js"></script>
<script src="js/perfil-db.js"></script>
<script src="js/storage.js"></script>
<script>
  function checkAuth(roles) {
    var s = getLoggedClient();
    if (!s || !s.email) { location.href = 'login.html'; return; }
    if (roles && roles.length && roles.indexOf(s.role || 'client') === -1) {
      location.href = 'login.html';
    }
  }
  function logout() {
    clearLoggedClient();
    location.href = 'V1.html';
  }
  function getAllUsers() {
    try { return JSON.parse(localStorage.getItem('lapinkClients') || '[]'); } catch(e) { return []; }
  }
  function updateAddress(email, addr) {
    try {
      var users = getAllUsers();
      var idx = users.findIndex(function(u) { return u.email.toLowerCase() === email.toLowerCase(); });
      if (idx === -1) return { ok: false, error: 'Usuário não encontrado.' };
      users[idx].address = addr;
      localStorage.setItem('lapinkClients', JSON.stringify(users));
      return { ok: true };
    } catch(e) { return { ok: false, error: 'Erro ao salvar.' }; }
  }
  async function updatePassword(email, nova) {
    try {
      var hash = await hashPassword(nova);
      var users = getAllUsers();
      var idx = users.findIndex(function(u) { return u.email.toLowerCase() === email.toLowerCase(); });
      if (idx === -1) return { ok: false, error: 'Usuário não encontrado.' };
      users[idx].password = hash;
      localStorage.setItem('lapinkClients', JSON.stringify(users));
      return { ok: true };
    } catch(e) { return { ok: false, error: 'Erro ao alterar senha.' }; }
  }
</script>
<link rel="stylesheet" href="css/Principal.css" />
<link rel="stylesheet" href="css/componentes.css" />
<link rel="stylesheet" href="css/PrincipalPublica.css" />
<link rel="stylesheet" href="css/public.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
<style>
  body { background: var(--gray-50); min-height: 100vh; }

  .conta-topbar {
    background: var(--white); border-bottom: .5px solid var(--gray-200);
    padding: 0 24px; height: 56px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
  }
  .conta-brand { display:flex; align-items:center; gap:10px; text-decoration:none; }
  .conta-brand .logo-bubble { width:32px; height:32px; background:var(--pink-400); }
  .conta-brand span { font-size:15px; font-weight:800; color:var(--pink-600); }
  .conta-topbar-actions { display:flex; align-items:center; gap:12px; }
  .conta-topbar-actions a { font-size:12px; color:var(--gray-400); text-decoration:none; }
  .conta-topbar-actions a:hover { color:var(--pink-500); }

  .conta-main { max-width: 800px; margin: 0 auto; padding: 32px 24px; }

  .conta-header {
    display: flex; align-items: center; gap: 16px; margin-bottom: 28px;
    background: var(--white); border: .5px solid var(--gray-200);
    border-radius: var(--radius-xl); padding: 20px 24px;
    box-shadow: var(--shadow-sm);
  }
  .conta-avatar {
    width: 52px; height: 52px; border-radius: 50%;
    background: var(--pink-100); display: flex; align-items: center; justify-content: center;
    font-size: 22px; color: var(--pink-500); flex-shrink: 0;
  }
  .conta-header-info h2 { font-size: 18px; font-weight: 800; color: var(--gray-800); }
  .conta-header-info p  { font-size: 12px; color: var(--gray-400); margin-top: 2px; }

  .conta-section-title {
    font-size: 13px; font-weight: 700; color: var(--gray-600);
    text-transform: uppercase; letter-spacing: .05em;
    margin-bottom: 12px; margin-top: 24px;
  }

  .pedido-card {
    background: var(--white); border: .5px solid var(--gray-200);
    border-radius: var(--radius-lg); padding: 16px 20px;
    margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between;
    gap: 12px; flex-wrap: wrap;
  }
  .pedido-card .p-info { flex: 1; }
  .pedido-card .p-id   { font-size: 11px; color: var(--gray-400); }
  .pedido-card .p-date { font-size: 12px; font-weight: 600; color: var(--gray-800); }
  .pedido-card .p-total { font-size: 16px; font-weight: 800; color: var(--pink-500); }

  .empty-pedidos {
    text-align: center; padding: 40px 20px;
    background: var(--white); border: .5px solid var(--gray-200);
    border-radius: var(--radius-lg); color: var(--gray-400);
  }
  .empty-pedidos i { font-size: 36px; display: block; margin-bottom: 10px; }

  .btn-logout {
    background: var(--red-50); color: var(--red-400);
    border: .5px solid #FCC; border-radius: var(--radius-full);
    padding: 9px 22px; font-size: 12px; font-weight: 600; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: background var(--transition);
  }
  .btn-logout:hover { background: #fee2e2; }
</style>
</head>
<body>
<script>checkAuth(['client', 'admin', 'superadmin']);</script>

<!-- Topbar -->
<header class="conta-topbar">
  <a href="V1.html" class="conta-brand">
    <div class="logo-bubble"><i class="ti ti-diamond" style="color:#fff;font-size:15px"></i></div>
    <span>LaPink</span>
  </a>
  <div class="conta-topbar-actions">
    <a href="V1.html"><i class="ti ti-shopping-bag"></i> Loja</a>
    <button class="btn-logout" onclick="logout()"><i class="ti ti-logout"></i> Sair</button>
  </div>
</header>

<main class="conta-main">

  <!-- Header com nome do cliente -->
  <div class="conta-header">
    <div class="conta-avatar"><i class="ti ti-user"></i></div>
    <div class="conta-header-info">
      <h2 id="nome-cliente">Carregando…</h2>
      <p id="email-cliente"></p>
    </div>
  </div>

  <!-- Seção: Meus Pedidos -->
  <div class="conta-section-title"><i class="ti ti-shopping-cart"></i> Meus pedidos</div>
  <div id="resumo-financeiro" style="display:none; margin-bottom:12px;">
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <div class="card" style="flex:1; min-width:130px; padding:14px 16px; border-top:3px solid #4ade80;">
        <div style="font-size:11px; color:var(--gray-400); font-weight:700; text-transform:uppercase; letter-spacing:.04em; margin-bottom:4px;">Total gasto</div>
        <div id="fin-total" style="font-size:18px; font-weight:800; color:var(--gray-800);">R$ 0,00</div>
      </div>
      <div class="card" style="flex:1; min-width:130px; padding:14px 16px; border-top:3px solid #facc15;">
        <div style="font-size:11px; color:var(--gray-400); font-weight:700; text-transform:uppercase; letter-spacing:.04em; margin-bottom:4px;">Pendente</div>
        <div id="fin-pendente" style="font-size:18px; font-weight:800; color:var(--gray-800);">R$ 0,00</div>
      </div>
      <div class="card" style="flex:1; min-width:130px; padding:14px 16px; border-top:3px solid var(--pink-400,#D4537E);">
        <div style="font-size:11px; color:var(--gray-400); font-weight:700; text-transform:uppercase; letter-spacing:.04em; margin-bottom:4px;">Pedidos</div>
        <div id="fin-count" style="font-size:18px; font-weight:800; color:var(--gray-800);">0</div>
      </div>
    </div>
  </div>
  <div id="lista-pedidos">
    <div class="empty-pedidos">
      <i class="ti ti-package-off"></i>
      <p>Nenhum pedido encontrado.</p>
    </div>
  </div>

  <!-- Seção: Endereços salvos -->
  <div class="conta-section-title"><i class="ti ti-map-pin"></i> Endereços salvos</div>
  <div id="enderecos-salvos" style="margin-bottom:14px;"><!-- renderizado por renderEnderecos() --></div>

  <div class="card">
    <div style="font-weight:700;font-size:14px;margin-bottom:12px;color:var(--gray-800);display:flex;align-items:center;gap:6px;">
      <i class="ti ti-plus" style="color:var(--pink-500,#D4537E);"></i> Adicionar endereço
    </div>
    <div class="form-group">
      <label>CEP</label>
      <div style="display:flex;gap:8px;">
        <input type="text" id="end-cep" placeholder="00000-000" maxlength="9" autocomplete="postal-code" style="flex:1;" oninput="mcMaskCep(this)" onblur="mcBuscaCep(this.value)" />
        <button type="button" id="mcCepBtn" onclick="mcBuscaCep(document.getElementById('end-cep').value)" class="btn btn-secondary btn-sm" style="white-space:nowrap;">Buscar</button>
      </div>
    </div>
    <div class="form-group">
      <label>Rua / Logradouro</label>
      <input type="text" id="end-rua" placeholder="Rua, Avenida..." autocomplete="street-address" />
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Número</label>
        <input type="text" id="end-numero" placeholder="Nº" />
      </div>
      <div class="form-group">
        <label>Complemento</label>
        <input type="text" id="end-complemento" placeholder="Apto, bloco..." />
      </div>
    </div>
    <div class="form-group">
      <label>Bairro</label>
      <input type="text" id="end-bairro" placeholder="Bairro" />
    </div>
    <div class="form-group">
      <label>Cidade / UF</label>
      <input type="text" id="end-cidade" placeholder="Cidade - UF" />
    </div>
    <div class="form-group">
      <label>Ponto de referência</label>
      <input type="text" id="end-referencia" placeholder="Ex: próximo ao mercado..." />
    </div>
    <button class="btn btn-primary btn-sm" onclick="salvarEndereco()">
      <i class="ti ti-check"></i> Adicionar endereço
    </button>
  </div>

  <!-- Seção: Alterar Senha -->
  <div class="conta-section-title"><i class="ti ti-lock"></i> Alterar senha</div>
  <div class="card">
    <div class="form-group">
      <label>Senha atual</label>
      <input type="password" id="senha-atual" placeholder="••••••••" autocomplete="current-password" />
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Nova senha</label>
        <input type="password" id="nova-senha" placeholder="Mínimo 6 caracteres" autocomplete="new-password" />
      </div>
      <div class="form-group">
        <label>Confirmar nova senha</label>
        <input type="password" id="confirmar-senha" placeholder="Repita a nova senha" autocomplete="new-password" />
      </div>
    </div>
    <div id="senha-erro" style="color:var(--red-400);font-size:12px;margin-bottom:10px;display:none;"></div>
    <button class="btn btn-secondary btn-sm" onclick="salvarSenha()">
      <i class="ti ti-key"></i> Alterar senha
    </button>
  </div>

</main>

<script>
  var _session = getLoggedClient();
  var _isAdmin = _session && (_session.role === 'admin' || _session.role === 'superadmin');

  function _toast(msg, tipo) {
    var el = document.getElementById('_mc_toast');
    if (!el) {
      el = document.createElement('div');
      el.id = '_mc_toast';
      el.setAttribute('role', 'status');
      el.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:11px 24px;border-radius:24px;font-size:13px;font-weight:600;color:#fff;z-index:9999;display:none;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.18);';
      document.body.appendChild(el);
    }
    el.style.background = tipo === 'erro' ? '#C0392B' : '#2A1520';
    el.textContent = msg;
    el.style.display = 'block';
    clearTimeout(el._t);
    el._t = setTimeout(function() { el.style.display = 'none'; }, 3000);
  }

  // Preenche dados da sessão
  document.getElementById('nome-cliente').textContent = _session ? _session.name : '';
  document.getElementById('email-cliente').textContent = _session ? _session.email : '';

  // Oculta seções de endereço e senha para admins (dados ficam em lapinkUsers, não lapinkClients)
  if (_isAdmin) {
    var secEndereco = document.querySelector('.conta-section-title:nth-of-type(2)');
    var cardEndereco = document.querySelector('.conta-main .card:first-of-type');
    document.querySelectorAll('.conta-section-title').forEach(function(el, i) {
      if (i > 0) { el.style.display = 'none'; }
    });
    document.querySelectorAll('.conta-main .card').forEach(function(el) { el.style.display = 'none'; });
    var aviso = document.createElement('div');
    aviso.style.cssText = 'background:var(--pink-50);border:1px solid var(--pink-200);border-radius:var(--radius-lg);padding:16px 20px;color:var(--pink-600);font-size:13px;margin-top:12px;';
    aviso.innerHTML = '<i class="ti ti-shield-lock" style="margin-right:6px;"></i>Administradores gerenciam senha e dados no <a href="../admin/configuracoes.html" style="color:var(--pink-500);font-weight:700;">Painel Admin</a>.';
    document.querySelector('.conta-main').appendChild(aviso);
  }

  // ── Endereços salvos ─────────────────────────────────────
  function _mcUsers() { try { return JSON.parse(localStorage.getItem('lapinkClients') || '[]'); } catch(e){ return []; } }
  function _mcUserIdx(users) { return users.findIndex(function(u){ return (u.email||'').toLowerCase() === (_session.email||'').toLowerCase(); }); }
  function _mcEsc(v){ return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  function getEnderecos() {
    var users = _mcUsers(); var idx = _mcUserIdx(users);
    if (idx === -1) return [];
    var u = users[idx];
    var arr = Array.isArray(u.enderecos) ? u.enderecos.slice() : [];
    if (!arr.length && u.endereco && (u.endereco.cep || u.endereco.rua)) arr = [u.endereco]; // migra o antigo
    return arr;
  }
  function _persistEnderecos(arr, padraoIdx) {
    var users = _mcUsers(); var idx = _mcUserIdx(users);
    if (idx === -1) return;
    users[idx].enderecos = arr;
    if (typeof padraoIdx === 'number' && arr[padraoIdx]) users[idx].endereco = arr[padraoIdx];
    else if (!arr.length) users[idx].endereco = null;
    else if (!users[idx].endereco) users[idx].endereco = arr[0];
    localStorage.setItem('lapinkClients', JSON.stringify(users));
    // Grava no banco por cliente (usuarios/{uid}) quando autenticado no Firebase Auth
    if (typeof window.salvarEnderecosDB === 'function') {
      window.salvarEnderecosDB(users[idx].enderecos || [], users[idx].endereco || null);
    }
  }
  function _enderecoLinhas(e) {
    var cidUf = [e.cidade, e.uf].filter(Boolean).join('/');
    var l1 = [e.rua, e.numero].filter(Boolean).join(', ');
    var l2 = [e.bairro, cidUf].filter(Boolean).join(' - ');
    var extra = [e.complemento, e.referencia].filter(Boolean).join(' · ');
    return [l1, l2, extra, (e.cep ? 'CEP ' + e.cep : '')].filter(Boolean);
  }
  function renderEnderecos() {
    var cont = document.getElementById('enderecos-salvos');
    if (!cont) return;
    var arr = getEnderecos();
    var users = _mcUsers(); var uidx = _mcUserIdx(users);
    var padrao = (uidx > -1 && users[uidx].endereco) ? JSON.stringify(users[uidx].endereco) : null;
    if (!arr.length) {
      cont.innerHTML = '<div class="card" style="text-align:center;color:var(--gray-400);font-size:13px;padding:18px;">Nenhum endereço salvo ainda. Adicione um abaixo.</div>';
      return;
    }
    cont.innerHTML = arr.map(function(e, i) {
      var ehPadrao = padrao && JSON.stringify(e) === padrao;
      var linhas = _enderecoLinhas(e).map(function(t){ return '<div style="font-size:12px;color:var(--gray-500);line-height:1.5;">'+_mcEsc(t)+'</div>'; }).join('');
      return '<div class="card" style="margin-bottom:10px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;'+(ehPadrao?'border:1.5px solid var(--pink-300,#F3A6C4);':'')+'">' +
        '<div style="flex:1;min-width:0;">' +
          (ehPadrao ? '<span class="badge badge-green" style="font-size:10px;padding:2px 8px;margin-bottom:6px;display:inline-block;">Padrão</span>' : '') +
          linhas +
        '</div>' +
        '<div style="display:flex;flex-direction:column;gap:6px;flex-shrink:0;">' +
          (ehPadrao ? '' : '<button type="button" class="btn btn-secondary btn-sm" onclick="definirPadrao('+i+')" title="Usar como padrão"><i class="ti ti-star"></i></button>') +
          '<button type="button" class="btn btn-secondary btn-sm" onclick="removerEndereco('+i+')" title="Remover" style="color:#e11d48;"><i class="ti ti-trash"></i></button>' +
        '</div>' +
      '</div>';
    }).join('');
  }
  window.definirPadrao = function(i){ var arr=getEnderecos(); if(!arr[i])return; _persistEnderecos(arr, i); renderEnderecos(); _toast('Endereço padrão atualizado.'); };
  window.removerEndereco = function(i){
    var arr=getEnderecos(); if(!arr[i])return;
    if(!confirm('Remover este endereço?'))return;
    var users=_mcUsers(); var uidx=_mcUserIdx(users);
    var eraPadrao = uidx>-1 && users[uidx].endereco && JSON.stringify(users[uidx].endereco)===JSON.stringify(arr[i]);
    arr.splice(i,1);
    _persistEnderecos(arr, eraPadrao ? 0 : undefined);
    renderEnderecos(); _toast('Endereço removido.');
  };
  renderEnderecos();

  // Se o cliente está autenticado no banco, traz os endereços salvos de lá
  if (typeof window.carregarEnderecosDB === 'function') {
    window.carregarEnderecosDB().then(function (d) {
      if (!d) return;
      var users = _mcUsers(); var idx = _mcUserIdx(users);
      if (idx === -1) return;
      users[idx].enderecos = d.enderecos || [];
      users[idx].endereco = d.endereco || (d.enderecos && d.enderecos[0]) || users[idx].endereco || null;
      localStorage.setItem('lapinkClients', JSON.stringify(users));
      renderEnderecos();
    }).catch(function () {});
  }

  function mcMaskCep(input) {
    var digitosAntes = input.value.slice(0, input.selectionStart).replace(/\D/g, '').length;
    var v = input.value.replace(/\D/g, '').slice(0, 8);
    input.value = v.length > 5 ? v.slice(0,5) + '-' + v.slice(5) : v;
    var pos = 0, cont = 0;
    while (pos < input.value.length && cont < digitosAntes) {
      if (/\d/.test(input.value.charAt(pos))) cont++;
      pos++;
    }
    try { input.setSelectionRange(pos, pos); } catch (e) {}
  }
  var _mcCepBuscando = false;
  function mcBuscaCep(cep) {
    var c = (cep || '').replace(/\D/g, '');
    if (c.length !== 8 || _mcCepBuscando) return;
    var btn = document.getElementById('mcCepBtn');
    _mcCepBuscando = true;
    if (btn) { btn.textContent = '...'; btn.disabled = true; }
    fetch('https://viacep.com.br/ws/' + c + '/json/')
      .then(function(r) { return r.json(); })
      .then(function(d) {
        if (d.erro) { _toast('CEP não encontrado.'); return; }
        document.getElementById('end-rua').value    = d.logradouro || '';
        document.getElementById('end-bairro').value = d.bairro     || '';
        document.getElementById('end-cidade').value = (d.localidade||'') + (d.uf ? ' - '+d.uf : '');
        document.getElementById('end-numero').focus();
      })
      .catch(function() { _toast('Erro ao buscar CEP.', 'erro'); })
      .finally(function() {
        _mcCepBuscando = false;
        if (btn) { btn.textContent = 'Buscar'; btn.disabled = false; }
      });
  }

  // Lista pedidos do cliente
  function renderPedidos() {
    var todos = JSON.parse(localStorage.getItem('lapinkPedidos') || '[]');
    var meus = todos.filter(function(p) {
      var emailPedido = (p.clienteEmail || (p.cliente && p.cliente.email) || '').toLowerCase();
      return _session && emailPedido !== '' && emailPedido === _session.email.toLowerCase();
    });
    var cont = document.getElementById('lista-pedidos');

    // Resumo financeiro
    var finTotal    = 0, finPendente = 0;
    meus.forEach(function(p) {
      var t = Number(p.total) || 0;
      var st = (p.status || '').toLowerCase();
      if (st !== 'cancelado') {
        finTotal += t;
        if (!p.pago && st !== 'concluido') finPendente += t;
      }
    });
    var resumoEl = document.getElementById('resumo-financeiro');
    if (meus.length && resumoEl) {
      document.getElementById('fin-total').textContent    = 'R$ ' + finTotal.toFixed(2).replace('.', ',');
      document.getElementById('fin-pendente').textContent = 'R$ ' + finPendente.toFixed(2).replace('.', ',');
      document.getElementById('fin-count').textContent    = meus.length;
      resumoEl.style.display = 'block';
    }

    if (!meus.length) {
      cont.innerHTML = '<div class="empty-pedidos"><i class="ti ti-package-off"></i><p>Nenhum pedido encontrado.</p></div>';
      return;
    }
    cont.innerHTML = meus.map(function(p) {
      var st = (p.status || 'aguardando').toLowerCase();
      var stLabel = { aguardando:'Aguardando', preparando:'Em preparo', enviado:'Enviado', concluido:'Concluído', cancelado:'Cancelado' }[st] || p.status;
      var badge   = st === 'concluido' ? 'badge-green' : st === 'cancelado' ? 'badge-red' : st === 'enviado' ? 'badge-blue' : 'badge-amber';
      var total   = p.total ? 'R$ ' + Number(p.total).toFixed(2).replace('.', ',') : '—';
      var data    = p.data ? new Date(p.data).toLocaleDateString('pt-BR') : '—';
      var pagoHtml = p.pago
        ? '<span class="badge badge-green" style="font-size:10px;padding:2px 8px;">Pago</span>'
        : '';
      return '<div class="pedido-card">' +
        '<div class="p-info">' +
          '<div class="p-id">Pedido ' + (p.numero || '#' + p.id) + '</div>' +
          '<div class="p-date">' + data + '</div>' +
        '</div>' +
        '<div style="display:flex; gap:6px; align-items:center;">' +
          '<span class="badge ' + badge + '">' + stLabel + '</span>' +
          pagoHtml +
        '</div>' +
        '<div class="p-total">' + total + '</div>' +
      '</div>';
    }).join('');
  }
  renderPedidos();

  function salvarEndereco() {
    var cidadeRaw = (document.getElementById('end-cidade').value || '').trim();
    var cidade = cidadeRaw, uf = '';
    var m = cidadeRaw.match(/^(.*?)[\s\-\/]+([A-Za-z]{2})$/); // separa "Cidade - UF"
    if (m) { cidade = m[1].trim(); uf = m[2].toUpperCase(); }
    var end = {
      cep:         (document.getElementById('end-cep').value         || '').trim(),
      rua:         (document.getElementById('end-rua').value         || '').trim(),
      numero:      (document.getElementById('end-numero').value      || '').trim(),
      complemento: (document.getElementById('end-complemento').value || '').trim(),
      bairro:      (document.getElementById('end-bairro').value      || '').trim(),
      cidade:      cidade,
      uf:          uf,
      referencia:  (document.getElementById('end-referencia').value  || '').trim()
    };
    if (!end.cep || !end.rua || !end.numero) { _toast('Preencha ao menos CEP, rua e número.', 'erro'); return; }
    if (_mcUserIdx(_mcUsers()) === -1) { _toast('Usuário não encontrado.', 'erro'); return; }
    var arr = getEnderecos();
    arr.push(end);
    _persistEnderecos(arr, arr.length === 1 ? 0 : undefined); // 1º endereço vira o padrão
    ['end-cep','end-rua','end-numero','end-complemento','end-bairro','end-cidade','end-referencia']
      .forEach(function(id){ var el=document.getElementById(id); if(el) el.value=''; });
    renderEnderecos();
    _toast('Endereço adicionado aos endereços salvos!');
  }

  async function salvarSenha() {
    var errEl = document.getElementById('senha-erro');
    errEl.style.display = 'none';
    var atual = document.getElementById('senha-atual').value;
    var nova  = document.getElementById('nova-senha').value;
    var conf  = document.getElementById('confirmar-senha').value;
    if (!atual) { errEl.textContent = 'Informe sua senha atual.'; errEl.style.display = 'block'; return; }
    if (!nova || nova.length < 6) { errEl.textContent = 'A nova senha deve ter no mínimo 6 caracteres.'; errEl.style.display = 'block'; return; }
    if (nova !== conf) { errEl.textContent = 'As senhas não coincidem.'; errEl.style.display = 'block'; return; }

    // Verifica senha atual antes de alterar
    var clients = typeof getAllUsers === 'function' ? getAllUsers() : [];
    var user = clients.find(function(u) { return u.email.toLowerCase() === _session.email.toLowerCase(); });
    if (!user) { errEl.textContent = 'Usuário não encontrado.'; errEl.style.display = 'block'; return; }
    var hashAtual = await hashPassword(atual);
    if (user.password !== hashAtual) { errEl.textContent = 'Senha atual incorreta.'; errEl.style.display = 'block'; return; }

    var r = await updatePassword(_session.email, nova);
    if (r.ok) {
      document.getElementById('senha-atual').value = '';
      document.getElementById('nova-senha').value = '';
      document.getElementById('confirmar-senha').value = '';
      _toast('Senha alterada com sucesso!');
    } else {
      errEl.textContent = r.error || 'Erro ao alterar senha.';
      errEl.style.display = 'block';
    }
  }
</script>
