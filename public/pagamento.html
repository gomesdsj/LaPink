<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Pagamento — LaPink</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#D4537E" />
<link rel="manifest" href="manifest.json" />
<link rel="stylesheet" href="css/Principal.css" />
<link rel="stylesheet" href="css/componentes.css" />
<link rel="stylesheet" href="css/PrincipalPublica.css" />
<link rel="stylesheet" href="css/public.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
<style>
/* ── Reset / base ── */
*, *::before, *::after { box-sizing: border-box; }
body { background: var(--gray-50); min-height: 100vh; margin: 0; }

/* ── Header ── */
.pg-header {
  background: #fff;
  border-bottom: .5px solid var(--pink-100);
  padding: 14px 24px;
  display: flex;
  align-items: center;
  gap: 14px;
  position: sticky;
  top: 0;
  z-index: 50;
}
.pg-header-logo {
  font-size: 20px;
  font-weight: 900;
  color: var(--pink-500);
  letter-spacing: -.5px;
  text-decoration: none;
}
.pg-header-steps {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  font-weight: 600;
}
.pg-header-steps .step { color: var(--gray-400); }
.pg-header-steps .step.active { color: var(--pink-500); }
.pg-header-steps .step-sep { color: var(--gray-300); }

/* ── Breadcrumb ── */
.pg-breadcrumb {
  max-width: 900px;
  margin: 10px auto 0;
  padding: 0 24px;
  font-size: 12px;
  color: #B08898;
}
.pg-breadcrumb a { color: var(--pink-500); text-decoration: none; font-weight: 600; }
.pg-breadcrumb a:hover { text-decoration: underline; }

/* ── Layout 2 colunas ── */
.pg-page {
  max-width: 900px;
  margin: 20px auto;
  padding: 0 20px 80px;
  display: flex;
  gap: 20px;
  align-items: flex-start;
}
.pg-left {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.pg-right {
  flex: 0 0 310px;
  position: sticky;
  top: 76px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* ── Cards ── */
.card {
  background: #fff;
  border-radius: 16px;
  padding: 20px;
  border: .5px solid var(--pink-100);
  box-shadow: 0 1px 6px rgba(212,83,126,.06);
}
.card-title {
  font-size: 11px;
  font-weight: 700;
  color: var(--pink-500);
  text-transform: uppercase;
  letter-spacing: .07em;
  display: flex;
  align-items: center;
  gap: 7px;
  padding-bottom: 12px;
  margin-bottom: 16px;
  border-bottom: .5px solid var(--pink-100);
}

/* ── Itens do pedido ── */
.pg-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 0;
  border-bottom: .5px solid var(--pink-50);
}
.pg-item:last-child { border-bottom: none; padding-bottom: 0; }
.pg-item:first-child { padding-top: 0; }
.pg-item-img {
  width: 52px;
  height: 52px;
  border-radius: 10px;
  flex-shrink: 0;
  background: var(--pink-50);
  border: .5px solid var(--pink-100);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  color: var(--pink-200);
  overflow: hidden;
}
.pg-item-img img { width: 100%; height: 100%; object-fit: cover; }
.pg-item-info { flex: 1; min-width: 0; }
.pg-item-name {
  font-size: 13px;
  font-weight: 700;
  color: var(--gray-800);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.pg-item-qty  { font-size: 11px; color: var(--gray-400); margin-top: 2px; }
.pg-item-price { font-size: 14px; font-weight: 800; color: var(--pink-500); white-space: nowrap; }

/* ── Formulário ── */
.pg-form-group { margin-bottom: 14px; }
.pg-form-group:last-child { margin-bottom: 0; }
.pg-form-group label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  color: var(--gray-600);
  margin-bottom: 6px;
}
.pg-form-group input,
.pg-form-group select {
  width: 100%;
  padding: 10px 14px;
  border: .5px solid var(--gray-200);
  border-radius: 8px;
  font-size: 13px;
  color: var(--gray-800);
  outline: none;
  background: #fff;
  transition: border-color .15s, box-shadow .15s;
}
.pg-form-group select { cursor: pointer; }
.pg-form-group input:focus,
.pg-form-group select:focus {
  border-color: var(--pink-300);
  box-shadow: 0 0 0 3px rgba(212,83,126,.10);
}
.pg-form-group input.err { border-color: #e05555; }
.pg-form-group input:disabled {
  background: var(--gray-50);
  color: var(--gray-400);
  cursor: not-allowed;
}
.req { color: #e05555; font-style: normal; }

/* ── Linha dupla (Número + Complemento, Cidade + Estado) ── */
.pg-form-row {
  display: flex;
  gap: 10px;
}
.pg-form-row .pg-form-group { flex: 1; margin-bottom: 0; }
.pg-form-row .pg-form-group.narrow { flex: 0 0 80px; }

/* ── CEP row ── */
.pg-cep-row { display: flex; gap: 8px; align-items: flex-end; }
.pg-cep-row .pg-form-group { flex: 1; margin-bottom: 0; }
.pg-cep-btn {
  flex-shrink: 0;
  height: 38px;
  padding: 0 14px;
  background: var(--pink-50);
  border: .5px solid var(--pink-200);
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
  color: var(--pink-500);
  cursor: pointer;
  white-space: nowrap;
  transition: background .15s;
}
.pg-cep-btn:hover { background: var(--pink-100); }
.pg-cep-btn:disabled { opacity: .5; cursor: default; }
.pg-cep-status {
  font-size: 11px;
  margin-top: 4px;
  min-height: 16px;
}
.pg-cep-status.ok  { color: #2E8B5A; }
.pg-cep-status.err { color: #e05555; }

/* ── Opções de frete ── */
.pg-frete-opts { display: flex; flex-direction: column; gap: 8px; }
.pg-frete-opt {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 14px;
  border: .5px solid var(--pink-100);
  border-radius: 12px;
  cursor: pointer;
  transition: border-color .15s, background .15s;
}
.pg-frete-opt:has(input:checked) {
  border-color: var(--pink-300);
  background: var(--pink-50);
}
.pg-frete-opt input[type="radio"] {
  accent-color: var(--pink-500);
  width: 15px;
  height: 15px;
  flex-shrink: 0;
  cursor: pointer;
}
.pg-frete-opt-info { flex: 1; }
.pg-frete-opt-label {
  font-size: 13px;
  font-weight: 700;
  color: var(--gray-800);
}
.pg-frete-opt-sub {
  font-size: 11px;
  color: var(--gray-400);
  margin-top: 1px;
}
.pg-frete-opt-preco {
  font-size: 14px;
  font-weight: 800;
  color: var(--pink-500);
  white-space: nowrap;
}
.pg-frete-opt-preco.gratis { color: #2E8B5A; }
.pg-frete-peso {
  font-size: 11px;
  color: var(--gray-400);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 5px;
}
.pg-frete-aviso {
  background: #fffbeb;
  border: 1px solid #fde68a;
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 11px;
  color: #92400e;
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 8px;
}
.pg-frete-gratis-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: #dcfce7;
  border: 1px solid #86efac;
  border-radius: 20px;
  padding: 3px 10px;
  font-size: 11px;
  font-weight: 700;
  color: #166534;
  margin-bottom: 10px;
}
.pg-frete-tag {
  font-size: 10px; font-weight: 700; color: var(--pink-600);
  background: var(--pink-50); border: 1px solid var(--pink-200);
  border-radius: 20px; padding: 1px 7px; margin-left: 6px; white-space: nowrap;
}

/* ── Formas de pagamento (estilo Kabum) ── */
.pg-pay-opt {
  display: flex; align-items: center; gap: 11px; padding: 12px 14px;
  border: .5px solid var(--pink-100); border-radius: 12px; cursor: pointer;
  transition: border-color .15s, background .15s; margin-bottom: 8px;
}
.pg-pay-opt:last-child { margin-bottom: 0; }
.pg-pay-opt:has(input:checked) { border-color: var(--pink-300); background: var(--pink-50); }
.pg-pay-opt input[type="radio"] { accent-color: var(--pink-500); width: 15px; height: 15px; flex-shrink: 0; cursor: pointer; }
.pg-pay-icon { font-size: 22px; color: var(--pink-500); width: 26px; text-align: center; flex-shrink: 0; }
.pg-pay-info { flex: 1; min-width: 0; }
.pg-pay-label { font-size: 13px; font-weight: 700; color: var(--gray-800); }
.pg-pay-sub { font-size: 11px; color: var(--gray-400); margin-top: 1px; }
.pg-pay-badge {
  font-size: 10px; font-weight: 700; color: #166534; background: #dcfce7;
  border: 1px solid #86efac; border-radius: 20px; padding: 2px 8px; white-space: nowrap;
}

/* ── Card de totais ── */
.pg-totals { display: flex; flex-direction: column; gap: 7px; }
.pg-tot-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
  color: var(--gray-500);
}
.pg-tot-row.bold {
  font-size: 16px;
  font-weight: 800;
  color: var(--gray-800);
  padding-top: 10px;
  margin-top: 4px;
  border-top: .5px solid var(--pink-100);
}
.pg-tot-row.bold span:last-child { color: var(--pink-500); }
.pg-tot-gratis { color: #2E8B5A !important; font-weight: 700; }

/* ── Botão Mercado Pago ── */
.pg-btn-mp {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  height: 48px;
  border-radius: 12px;
  border: none;
  cursor: pointer;
  background: var(--pink-500);
  color: #fff;
  font-size: 15px;
  font-weight: 800;
  transition: background .15s, transform .1s;
  margin-top: 4px;
}
.pg-btn-mp:hover:not(:disabled) {
  background: var(--pink-600);
  transform: translateY(-1px);
}
.pg-btn-mp:disabled { opacity: .6; cursor: not-allowed; transform: none; }
.pg-btn-mp i { font-size: 18px; }

/* ── Spinner ── */
@keyframes spin { to { transform: rotate(360deg); } }
.spin-icon { display: inline-block; animation: spin 1s linear infinite; }

/* ── Nota de segurança ── */
.pg-security-note {
  font-size: 11px;
  color: var(--gray-400);
  text-align: center;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  margin-top: 6px;
}

/* ── Mobile ≤ 680px ── */
@media (max-width: 680px) {
  .pg-page {
    flex-direction: column;
    padding: 0 14px 80px;
    margin-top: 14px;
    gap: 14px;
  }
  .pg-right {
    position: static;
    flex: none;
    width: 100%;
  }
  .pg-header { padding: 12px 16px; }
  .pg-breadcrumb { padding: 0 16px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>
<body>

<!-- Scripts (antes de qualquer render) -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-init.js"></script>
<script src="js/cloud-sync.js"></script>
<script src="js/cart.js"></script>
<script src="js/storage.js"></script>
<script src="js/auth.js"></script>

<script>
// ── Auth Gate ──────────────────────────────────────────────────────────────
var _client = typeof getLoggedClient === 'function' ? getLoggedClient() : null;
if (!_client) {
  sessionStorage.setItem('referrerPage', 'pagamento.html');
  location.replace('login.html');
}

// ── Cart Gate ──────────────────────────────────────────────────────────────
var _cart = typeof getCart === 'function' ? getCart() : [];
if (!_cart.length) {
  location.replace('V1.html');
}
</script>

<!-- ── Cabeçalho ── -->
<header class="pg-header">
  <a href="V1.html" class="pg-header-logo">LaPink</a>
  <div class="pg-header-steps">
    <span class="step">Sacola</span>
    <span class="step-sep">›</span>
    <span class="step">Identificação</span>
    <span class="step-sep">›</span>
    <span class="step">Entrega</span>
    <span class="step-sep">›</span>
    <span class="step active">Pagamento</span>
  </div>
</header>

<!-- ── Breadcrumb ── -->
<nav class="pg-breadcrumb" aria-label="Navegação">
  <a href="V1.html">Loja</a>
  <span aria-hidden="true" style="margin: 0 6px;">›</span>
  <span>Pagamento</span>
</nav>

<!-- ── Layout principal ── -->
<div class="pg-page" id="pgPage">

  <!-- ══ COLUNA ESQUERDA ══ -->
  <div class="pg-left">

    <!-- Card: Resumo do pedido -->
    <div class="card">
      <div class="card-title"><i class="ti ti-shopping-bag" aria-hidden="true"></i> Resumo do pedido</div>
      <div id="pgItems"><!-- JS --></div>
    </div>

    <!-- Card: Seus dados -->
    <div class="card">
      <div class="card-title"><i class="ti ti-user" aria-hidden="true"></i> Seus dados</div>

      <div class="pg-form-group">
        <label for="pgNome">Nome completo <span class="req" aria-label="obrigatório">*</span></label>
        <input type="text" id="pgNome" placeholder="Seu nome completo" autocomplete="name" inputmode="text" />
      </div>

      <div class="pg-form-group">
        <label for="pgCpf">CPF <span class="req" aria-label="obrigatório">*</span></label>
        <input type="text" id="pgCpf" placeholder="000.000.000-00" autocomplete="off" inputmode="numeric" maxlength="14" />
      </div>

      <div class="pg-form-group">
        <label for="pgCelular">Celular <span class="req" aria-label="obrigatório">*</span></label>
        <input type="tel" id="pgCelular" placeholder="(00) 00000-0000" autocomplete="tel" inputmode="tel" maxlength="16" />
      </div>
    </div>

    <!-- Card: Endereço de entrega -->
    <div class="card">
      <div class="card-title"><i class="ti ti-map-pin" aria-hidden="true"></i> Endereço de entrega</div>

      <div class="pg-form-group" id="pgEndSalvosWrap" style="display:none; margin-bottom: 14px;">
        <label for="pgEndSalvos">Endereços salvos</label>
        <select id="pgEndSalvos" onchange="_selecionarEndSalvo()"></select>
      </div>

      <div class="pg-form-group" style="margin-bottom: 4px;">
        <label for="pgCep">CEP <span class="req" aria-label="obrigatório">*</span></label>
        <div class="pg-cep-row">
          <div class="pg-form-group">
            <input type="text" id="pgCep" placeholder="00000-000" inputmode="numeric" maxlength="9" autocomplete="postal-code" />
          </div>
          <button type="button" class="pg-cep-btn" id="pgCepBtn" onclick="buscarCep()">
            <i class="ti ti-search" aria-hidden="true"></i> Buscar
          </button>
        </div>
        <div class="pg-cep-status" id="pgCepStatus" aria-live="polite"></div>
      </div>

      <div class="pg-form-group">
        <label for="pgRua">Rua / Logradouro <span class="req" aria-label="obrigatório">*</span></label>
        <input type="text" id="pgRua" placeholder="Nome da rua" autocomplete="street-address" />
      </div>

      <div class="pg-form-row" style="margin-bottom: 14px;">
        <div class="pg-form-group narrow">
          <label for="pgNumero">Número <span class="req" aria-label="obrigatório">*</span></label>
          <input type="text" id="pgNumero" placeholder="Nº" inputmode="numeric" autocomplete="off" />
        </div>
        <div class="pg-form-group">
          <label for="pgComplemento">Complemento</label>
          <input type="text" id="pgComplemento" placeholder="Apto, bloco..." autocomplete="off" />
        </div>
      </div>

      <div class="pg-form-group">
        <label for="pgBairro">Bairro <span class="req" aria-label="obrigatório">*</span></label>
        <input type="text" id="pgBairro" placeholder="Bairro" autocomplete="off" />
      </div>

      <div class="pg-form-row">
        <div class="pg-form-group">
          <label for="pgCidade">Cidade <span class="req" aria-label="obrigatório">*</span></label>
          <input type="text" id="pgCidade" placeholder="Cidade" autocomplete="address-level2" />
        </div>
        <div class="pg-form-group narrow">
          <label for="pgEstado">UF <span class="req" aria-label="obrigatório">*</span></label>
          <input type="text" id="pgEstado" placeholder="UF" maxlength="2" autocomplete="address-level1" style="text-transform: uppercase;" />
        </div>
      </div>
    </div>

    <!-- Card: Forma de pagamento -->
    <div class="card">
      <div class="card-title"><i class="ti ti-credit-card" aria-hidden="true"></i> Forma de pagamento</div>
      <div id="pgPagamento"><!-- JS --></div>
    </div>

  </div>
  <!-- /pg-left -->

  <!-- ══ COLUNA DIREITA ══ -->
  <div class="pg-right">

    <!-- Card: Modalidade de entrega -->
    <div class="card" id="pgFreteCard">
      <div class="card-title"><i class="ti ti-truck-delivery" aria-hidden="true"></i> Modalidade de entrega</div>
      <div id="pgFreteConteudo"><!-- JS --></div>
    </div>

    <!-- Card: Totais -->
    <div class="card">
      <div class="card-title"><i class="ti ti-receipt" aria-hidden="true"></i> Totais</div>
      <div class="pg-totals" id="pgTotais"><!-- JS --></div>
    </div>

    <!-- Botão Mercado Livre (checkout Mercado Pago da conta vinculada) -->
    <button class="pg-btn-mp" id="pgBtnMP" onclick="pagarComMP()">
      <i class="ti ti-lock" aria-hidden="true"></i>
      Pagar com Mercado Livre
    </button>
    <p class="pg-security-note">
      <i class="ti ti-shield-check" aria-hidden="true"></i>
      Você será levado ao checkout seguro do Mercado Livre (Mercado Pago) para concluir o pagamento.
    </p>

  </div>
  <!-- /pg-right -->

</div>
<!-- /pg-page -->

<script>
(function () {
  'use strict';

  /* ── Utilidades ─────────────────────────────────────────── */
  function _esc(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
  function fmtR(v) {
    return 'R$ ' + Number(v).toFixed(2).replace('.', ',');
  }
  function _entCfg() {
    try { return JSON.parse(localStorage.getItem('lapinkEntregaConfig') || '{}'); } catch (e) { return {}; }
  }
  function _produtos() {
    try { return JSON.parse(localStorage.getItem('lapinkProdutos') || '[]'); } catch (e) { return []; }
  }

  /* ── Estado global ──────────────────────────────────────── */
  var _modalidadeSelecionada = '';  // 'pac' | 'sedex' | 'retirada' | 'local' | 'me_<id>'
  var _freteValor = 0;
  var _pesoTotal = 0;
  var _subtotal = 0;
  var _freteGratisAtivo = false;
  var _freteOpcoesAPI = null;       // cotação real por CEP (Melhor Envio); null = usa tabela
  var _formaPagamento = 'pix';      // forma de pagamento escolhida (visual; MP processa quando ativo)

  var COTAR_FRETE_URL = 'https://us-central1-lapink-82a39.cloudfunctions.net/cotarFrete';

  /* ── Cotação de frete real por CEP (Melhor Envio via Cloud Function) ──
     Retorna array de opções [{id,empresa,servico,preco,prazo}] ou null
     (não configurado / Blaze inativo / erro) → o checkout cai na tabela manual. */
  async function cotarFreteAPI(cepDestino, pesoG, valor) {
    try {
      var resp = await fetch(COTAR_FRETE_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ cepDestino: cepDestino, pesoG: pesoG, valor: valor })
      });
      if (!resp.ok) return null;
      var data = await resp.json();
      return (data && Array.isArray(data.opcoes) && data.opcoes.length) ? data.opcoes : null;
    } catch (e) { return null; }
  }

  // Dispara a cotação quando há um CEP de destino válido (8 dígitos).
  async function atualizarFretePorCep() {
    var cepEl = document.getElementById('pgCep');
    var cep = (cepEl ? cepEl.value : '').replace(/\D/g, '');
    if (cep.length !== 8) { _freteOpcoesAPI = null; return; }
    _subtotal = (typeof getCart === 'function' ? getCart() : _cart)
      .reduce(function (s, i) { return s + i.preco * i.qty; }, 0);
    _pesoTotal = calcularPeso();
    var cont = document.getElementById('pgFreteConteudo');
    if (cont) cont.insertAdjacentHTML('afterbegin',
      '<div id="pgFreteCotando" class="pg-frete-peso"><i class="ti ti-loader-2 spin-icon"></i> Cotando frete para o seu CEP…</div>');
    var opc = await cotarFreteAPI(cep, _pesoTotal, _subtotal);
    _freteOpcoesAPI = opc;        // array (sucesso) ou null (fallback tabela)
    _modalidadeSelecionada = '';  // reavalia a seleção com as novas opções
    renderFrete();
  }

  /* ── Máscaras ───────────────────────────────────────────── */
  function maskCpf(v) {
    v = v.replace(/\D/g, '').slice(0, 11);
    if (v.length > 9) return v.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
    if (v.length > 6) return v.replace(/(\d{3})(\d{3})(\d{0,3})/, '$1.$2.$3');
    if (v.length > 3) return v.replace(/(\d{3})(\d{0,3})/, '$1.$2');
    return v;
  }
  function maskCelular(v) {
    v = v.replace(/\D/g, '').slice(0, 11);
    if (v.length > 6) return v.replace(/(\d{2})(\d{5})(\d{0,4})/, '($1) $2-$3');
    if (v.length > 2) return v.replace(/(\d{2})(\d{0,5})/, '($1) $2');
    return v;
  }
  function maskCep(v) {
    v = v.replace(/\D/g, '').slice(0, 8);
    if (v.length > 5) return v.replace(/(\d{5})(\d{0,3})/, '$1-$2');
    return v;
  }

  /* ── Aplica máscara PRESERVANDO a posição do cursor ──────────
     Conta os dígitos antes do cursor e reposiciona após a mesma
     quantidade de dígitos no texto formatado. Sem isso, ao inserir
     um separador (. - ()) o cursor cai no lugar errado e os números
     "embaralham" quando se digita/edita no meio do campo. */
  function _aplicarMascara(el, maskFn) {
    var digitosAntes = el.value.slice(0, el.selectionStart).replace(/\D/g, '').length;
    el.value = maskFn(el.value);
    var pos = 0, cont = 0;
    while (pos < el.value.length && cont < digitosAntes) {
      if (/\d/.test(el.value.charAt(pos))) cont++;
      pos++;
    }
    try { el.setSelectionRange(pos, pos); } catch (e) {}
  }

  /* ── Campo CPF ── */
  document.getElementById('pgCpf').addEventListener('input', function () {
    _aplicarMascara(this, maskCpf);
  });

  /* ── Campo Celular ── */
  document.getElementById('pgCelular').addEventListener('input', function () {
    _aplicarMascara(this, maskCelular);
  });

  /* ── Campo CEP ── */
  var inpCep = document.getElementById('pgCep');
  inpCep.addEventListener('input', function () {
    _aplicarMascara(this, maskCep);
    if (this.value.replace(/\D/g, '').length === 8) buscarCep();
  });

  /* ── Estado UF: maiúsculo ── */
  document.getElementById('pgEstado').addEventListener('input', function () {
    this.value = this.value.toUpperCase();
  });

  /* ── ViaCEP ─────────────────────────────────────────────── */
  window.buscarCep = function () {
    var cep = inpCep.value.replace(/\D/g, '');
    var statusEl = document.getElementById('pgCepStatus');
    var btn = document.getElementById('pgCepBtn');
    if (cep.length !== 8) {
      statusEl.textContent = 'CEP deve ter 8 dígitos.';
      statusEl.className = 'pg-cep-status err';
      return;
    }
    btn.disabled = true;
    btn.textContent = 'Buscando...';
    statusEl.textContent = '';
    statusEl.className = 'pg-cep-status';

    fetch('https://viacep.com.br/ws/' + cep + '/json/')
      .then(function (r) { return r.json(); })
      .then(function (d) {
        btn.disabled = false;
        btn.innerHTML = '<i class="ti ti-search" aria-hidden="true"></i> Buscar';
        if (d.erro) {
          statusEl.textContent = 'CEP não encontrado.';
          statusEl.className = 'pg-cep-status err';
          return;
        }
        document.getElementById('pgRua').value    = d.logradouro || '';
        document.getElementById('pgBairro').value = d.bairro     || '';
        document.getElementById('pgCidade').value = d.localidade || '';
        document.getElementById('pgEstado').value = (d.uf || '').toUpperCase();
        statusEl.textContent = 'Endereço encontrado!';
        statusEl.className = 'pg-cep-status ok';
        document.getElementById('pgNumero').focus();
        // Remover erros dos campos preenchidos
        ['pgRua', 'pgBairro', 'pgCidade', 'pgEstado'].forEach(function (id) {
          document.getElementById(id).classList.remove('err');
        });
        atualizarFretePorCep(); // cota frete real para o CEP encontrado
      })
      .catch(function () {
        btn.disabled = false;
        btn.innerHTML = '<i class="ti ti-search" aria-hidden="true"></i> Buscar';
        statusEl.textContent = 'Erro ao buscar CEP. Tente novamente.';
        statusEl.className = 'pg-cep-status err';
      });
  };

  /* ── Calcular peso total ────────────────────────────────── */
  function calcularPeso() {
    var prods = _produtos();
    var cart = typeof getCart === 'function' ? getCart() : _cart;
    var peso = cart.reduce(function (s, item) {
      var p = prods.find(function (x) { return String(x.id) === String(item.id); });
      // O cadastro salva o peso como "pesoEnvioGramas" (fallback p/ pesoEnvioG por compat.)
      var pesoUnit = p ? Number(p.pesoEnvioGramas || p.pesoEnvioG || 0) : 0;
      return s + pesoUnit * item.qty;
    }, 0);
    peso += 300; // embalagem padrão
    return peso;
  }

  /* ── Encontrar preço na tabela de frete ─────────────────── */
  function precoNaTabela(tabela, pesoG) {
    if (!tabela || !tabela.length) return null;
    var ordenada = tabela.slice().sort(function (a, b) { return Number(a.ateG) - Number(b.ateG); });
    var faixa = ordenada.find(function (r) { return pesoG <= Number(r.ateG); });
    return faixa ? Number(faixa.preco) : null; // null = excede tabela
  }

  /* ── Renderizar itens do pedido ─────────────────────────── */
  function renderItens() {
    var cart = typeof getCart === 'function' ? getCart() : _cart;
    var el = document.getElementById('pgItems');
    _subtotal = cart.reduce(function (s, i) { return s + i.preco * i.qty; }, 0);

    el.innerHTML = cart.map(function (item) {
      var imgHtml = item.imagem
        ? '<img src="' + _esc(item.imagem) + '" alt="' + _esc(item.nome) + '" loading="lazy" />'
        : '<i class="ti ti-diamond" aria-hidden="true"></i>';
      return '<div class="pg-item">' +
        '<div class="pg-item-img">' + imgHtml + '</div>' +
        '<div class="pg-item-info">' +
          '<div class="pg-item-name">' + _esc(item.nome) + '</div>' +
          '<div class="pg-item-qty">Qtd: ' + item.qty + '</div>' +
        '</div>' +
        '<div class="pg-item-price">' + fmtR(item.preco * item.qty) + '</div>' +
        '</div>';
    }).join('');
  }

  /* ── Renderizar opções de frete ─────────────────────────── */
  function renderFrete() {
    var cfg = _entCfg();
    var el = document.getElementById('pgFreteConteudo');
    _pesoTotal = calcularPeso();

    // Verificar frete grátis
    var gratisAtivo = cfg.gratis && cfg.gratis.ativo;
    var gratisMin = gratisAtivo ? Number(cfg.gratis.minimo || 0) : Infinity;
    _freteGratisAtivo = gratisAtivo && _subtotal >= gratisMin;

    var opcoes = [];
    var excedeuTabela = false;
    var usouAPI = Array.isArray(_freteOpcoesAPI) && _freteOpcoesAPI.length > 0;

    if (usouAPI) {
      // Cotação real por CEP (Melhor Envio): Correios + outras transportadoras
      _freteOpcoesAPI.forEach(function (o) {
        opcoes.push({
          id: 'me_' + o.id,
          label: (o.empresa ? o.empresa + ' ' : '') + (o.servico || 'Transportadora'),
          sub: o.prazo ? ('Entrega em até ' + o.prazo + ' dia(s) útil(eis)') : 'Cotação por CEP',
          icon: 'ti-truck-delivery',
          preco: _freteGratisAtivo ? 0 : (Number(o.preco) || 0),
          isGratis: _freteGratisAtivo
        });
      });
    } else {
      // Fallback: tabela manual por peso configurada pelo lojista (PAC/SEDEX)
      if (cfg.pac && cfg.pac.ativo) {
        var precoPac = precoNaTabela(cfg.pac.tabela, _pesoTotal);
        if (precoPac === null) {
          excedeuTabela = true;
        } else {
          opcoes.push({
            id: 'pac',
            label: 'PAC (Correios)',
            sub: 'Prazo padrão dos Correios',
            icon: 'ti-package',
            preco: _freteGratisAtivo ? 0 : precoPac,
            isGratis: _freteGratisAtivo
          });
        }
      }

      if (cfg.sedex && cfg.sedex.ativo) {
        var precoSedex = precoNaTabela(cfg.sedex.tabela, _pesoTotal);
        if (precoSedex === null) {
          excedeuTabela = true;
        } else {
          opcoes.push({
            id: 'sedex',
            label: 'SEDEX (Correios)',
            sub: 'Entrega expressa',
            icon: 'ti-bolt',
            preco: _freteGratisAtivo ? 0 : precoSedex,
            isGratis: _freteGratisAtivo
          });
        }
      }
    }

    // Retirada na loja
    if (cfg.retirada && cfg.retirada.ativo) {
      opcoes.push({
        id: 'retirada',
        label: 'Retirada na loja',
        sub: 'Combine horário após o pedido',
        icon: 'ti-map-pin',
        preco: 0,
        isGratis: true
      });
    }

    // Entrega local
    if (cfg.local && cfg.local.ativo) {
      opcoes.push({
        id: 'local',
        label: 'Entrega local',
        sub: 'Entrega na cidade',
        icon: 'ti-motorbike',
        preco: _freteGratisAtivo ? 0 : Number(cfg.local.taxa || 0),
        isGratis: _freteGratisAtivo
      });
    }

    // Marca a opção paga mais barata (destaque estilo Kabum)
    if (opcoes.length > 1) {
      var pagas = opcoes.filter(function (o) { return !o.isGratis && o.preco > 0; });
      if (pagas.length) {
        var minP = Math.min.apply(null, pagas.map(function (o) { return o.preco; }));
        opcoes.forEach(function (o) { if (!o.isGratis && o.preco === minP) { o.maisBarato = true; } });
      }
    }

    var html = '';

    // Badge frete grátis
    if (_freteGratisAtivo) {
      html += '<div class="pg-frete-gratis-badge"><i class="ti ti-sparkles" aria-hidden="true"></i> Frete grátis disponível neste pedido!</div>';
    }

    // Peso
    html += '<div class="pg-frete-peso"><i class="ti ti-weight" aria-hidden="true"></i> Peso estimado: <strong>' + _pesoTotal + 'g</strong> (incl. embalagem)</div>';

    if (!opcoes.length) {
      html += '<div class="pg-frete-aviso"><i class="ti ti-info-circle" aria-hidden="true"></i> Nenhuma modalidade de entrega disponível no momento.</div>';
    } else {
      html += '<div class="pg-frete-opts">';
      opcoes.forEach(function (op, idx) {
        var checked = (op.id === _modalidadeSelecionada) || (idx === 0 && !_modalidadeSelecionada);
        if (checked && !_modalidadeSelecionada) {
          _modalidadeSelecionada = op.id;
          _freteValor = op.preco;
        }
        var precoStr = op.isGratis
          ? '<span class="pg-frete-opt-preco gratis">Grátis</span>'
          : '<span class="pg-frete-opt-preco">' + fmtR(op.preco) + '</span>';

        html += '<label class="pg-frete-opt">' +
          '<input type="radio" name="pgFrete" value="' + _esc(op.id) + '"' + (checked ? ' checked' : '') + ' />' +
          '<div class="pg-frete-opt-info">' +
            '<div class="pg-frete-opt-label"><i class="ti ' + _esc(op.icon) + '" aria-hidden="true"></i> ' + _esc(op.label) + (op.maisBarato ? '<span class="pg-frete-tag">Mais barato</span>' : '') + '</div>' +
            '<div class="pg-frete-opt-sub">' + _esc(op.sub) + '</div>' +
          '</div>' +
          precoStr +
          '</label>';
      });
      html += '</div>';
    }

    if (excedeuTabela) {
      html += '<div class="pg-frete-aviso" style="margin-top:10px;"><i class="ti ti-alert-triangle" aria-hidden="true"></i> O peso do pedido excede as faixas configuradas. Entre em contato para combinar o frete dos Correios.</div>';
    }

    el.innerHTML = html;

    // Eventos nos radios
    el.querySelectorAll('input[name="pgFrete"]').forEach(function (inp) {
      inp.addEventListener('change', function () {
        if (!this.checked) return;
        _modalidadeSelecionada = this.value;
        var op = opcoes.find(function (o) { return o.id === inp.value; });
        _freteValor = op ? op.preco : 0;
        renderTotais();
      });
    });

    renderTotais();
  }

  /* ── Renderizar totais ──────────────────────────────────── */
  function renderTotais() {
    var el = document.getElementById('pgTotais');
    var total = _subtotal + _freteValor;

    var freteHtml = '';
    if (_modalidadeSelecionada === 'retirada' || (_freteGratisAtivo && _freteValor === 0 && _modalidadeSelecionada)) {
      freteHtml = '<div class="pg-tot-row"><span>Frete</span><span class="pg-tot-gratis">Grátis</span></div>';
    } else if (_modalidadeSelecionada) {
      freteHtml = '<div class="pg-tot-row"><span>Frete</span><span>' + fmtR(_freteValor) + '</span></div>';
    } else {
      freteHtml = '<div class="pg-tot-row"><span>Frete</span><span style="color:var(--gray-400)">A combinar</span></div>';
    }

    el.innerHTML =
      '<div class="pg-tot-row"><span>Subtotal</span><span>' + fmtR(_subtotal) + '</span></div>' +
      freteHtml +
      '<div class="pg-tot-row bold"><span>TOTAL</span><span>' + fmtR(total) + '</span></div>';

    renderFormaPagamento(); // recalcula parcelas conforme o total
  }

  /* ── Formas de pagamento (estilo Kabum; visual até o Mercado Pago ativar) ── */
  function renderFormaPagamento() {
    var el = document.getElementById('pgPagamento');
    if (!el) return;
    var total = _subtotal + _freteValor;
    var base = total > 0 ? total : _subtotal;
    var parcelas = Math.max(1, Math.min(12, Math.floor(base / 5))); // parcela mínima ~R$5
    var valorParc = parcelas > 0 ? base / parcelas : base;
    var opts = [
      { id: 'pix',    icon: 'ti-qrcode',      label: 'PIX',                sub: 'Aprovação na hora, 100% seguro',                 badge: 'à vista' },
      { id: 'cartao', icon: 'ti-credit-card', label: 'Cartão de crédito',  sub: 'em até ' + parcelas + 'x de ' + fmtR(valorParc) + ' sem juros' },
      { id: 'boleto', icon: 'ti-barcode',     label: 'Boleto bancário',    sub: 'Compensa em até 3 dias úteis',                    badge: 'à vista' }
    ];
    el.innerHTML = opts.map(function (o) {
      var checked = o.id === _formaPagamento;
      return '<label class="pg-pay-opt">' +
        '<input type="radio" name="pgPay" value="' + o.id + '"' + (checked ? ' checked' : '') + ' />' +
        '<i class="pg-pay-icon ti ' + o.icon + '" aria-hidden="true"></i>' +
        '<div class="pg-pay-info"><div class="pg-pay-label">' + o.label + '</div><div class="pg-pay-sub">' + o.sub + '</div></div>' +
        (o.badge ? '<span class="pg-pay-badge">' + o.badge + '</span>' : '') +
        '</label>';
    }).join('');
    el.querySelectorAll('input[name="pgPay"]').forEach(function (inp) {
      inp.addEventListener('change', function () { if (this.checked) _formaPagamento = this.value; });
    });
  }

  /* ── Perfil salvo do cliente (lapinkClients) ────────────── */
  function _perfilAtual() {
    try {
      var email = (_client && _client.email) || '';
      if (!email) { var s = JSON.parse(localStorage.getItem('lapinkSession') || 'null'); email = s && s.email; }
      if (!email) return null;
      var users = JSON.parse(localStorage.getItem('lapinkClients') || '[]');
      return users.find(function (u) { return (u.email || '').toLowerCase() === email.toLowerCase(); }) || null;
    } catch (e) { return null; }
  }

  /* ── Pré-preencher dados do cliente já cadastrado ────────
     Puxa nome, celular, CPF e endereço salvos. Os campos continuam
     editáveis — o cliente pode trocar o endereço na hora da compra. */
  function preencherDados() {
    var user = _perfilAtual();
    var nome = (user && user.name) || (_client && _client.name) || '';
    if (nome) document.getElementById('pgNome').value = nome;
    if (!user) return;

    if (user.cpf) document.getElementById('pgCpf').value = maskCpf(user.cpf);
    var cel = user.whatsapp || user.celular || '';
    if (cel) document.getElementById('pgCelular').value = maskCelular(cel);

    var e = user.endereco || {};
    if (e.cep)         document.getElementById('pgCep').value         = maskCep(e.cep);
    if (e.rua)         document.getElementById('pgRua').value         = e.rua;
    if (e.numero)      document.getElementById('pgNumero').value      = e.numero;
    if (e.complemento) document.getElementById('pgComplemento').value = e.complemento;
    if (e.bairro)      document.getElementById('pgBairro').value      = e.bairro;
    if (e.cidade)      document.getElementById('pgCidade').value      = e.cidade;
    if (e.uf)          document.getElementById('pgEstado').value      = String(e.uf).toUpperCase();

    // Se já tem CEP salvo, cota o frete automaticamente
    if ((e.cep || '').replace(/\D/g, '').length === 8) { try { atualizarFretePorCep(); } catch (x) {} }

    _popularEndSalvos();
  }

  /* ── Seletor de endereços salvos no checkout ── */
  function _popularEndSalvos() {
    var wrap = document.getElementById('pgEndSalvosWrap');
    var sel  = document.getElementById('pgEndSalvos');
    if (!wrap || !sel) return;
    var user = _perfilAtual();
    var arr = (user && Array.isArray(user.enderecos)) ? user.enderecos
      : (user && user.endereco && user.endereco.cep ? [user.endereco] : []);
    window._endSalvos = arr;
    if (!arr.length) { wrap.style.display = 'none'; return; }
    var padraoKey = (user && user.endereco) ? JSON.stringify(user.endereco) : null;
    var selIdx = 0;
    sel.innerHTML = arr.map(function (e, i) {
      if (padraoKey && JSON.stringify(e) === padraoKey) selIdx = i;
      var txt = [(e.rua || ''), (e.numero || '')].filter(Boolean).join(', ') +
                (e.bairro ? ' - ' + e.bairro : '') +
                (e.cidade ? ' (' + e.cidade + (e.uf ? '/' + e.uf : '') + ')' : '');
      return '<option value="' + i + '">' + _esc(txt || ('Endereço ' + (i + 1))) + '</option>';
    }).join('') + '<option value="novo">+ Usar outro endereço</option>';
    sel.value = String(selIdx);
    wrap.style.display = '';
  }

  window._selecionarEndSalvo = function () {
    var sel = document.getElementById('pgEndSalvos');
    if (!sel) return;
    if (sel.value === 'novo') {
      ['pgCep', 'pgRua', 'pgNumero', 'pgComplemento', 'pgBairro', 'pgCidade', 'pgEstado']
        .forEach(function (id) { document.getElementById(id).value = ''; });
      _freteOpcoesAPI = null; _modalidadeSelecionada = ''; renderFrete();
      document.getElementById('pgCep').focus();
      return;
    }
    var e = (window._endSalvos || [])[parseInt(sel.value)];
    if (!e) return;
    document.getElementById('pgCep').value         = maskCep(e.cep || '');
    document.getElementById('pgRua').value         = e.rua || '';
    document.getElementById('pgNumero').value      = e.numero || '';
    document.getElementById('pgComplemento').value = e.complemento || '';
    document.getElementById('pgBairro').value      = e.bairro || '';
    document.getElementById('pgCidade').value      = e.cidade || '';
    document.getElementById('pgEstado').value      = (e.uf || '').toUpperCase();
    if ((e.cep || '').replace(/\D/g, '').length === 8) { try { atualizarFretePorCep(); } catch (x) {} }
  };

  /* ── Salva os dados informados no perfil (p/ próximas compras) ── */
  function _salvarPerfilCheckout() {
    try {
      var email = (_client && _client.email) || (JSON.parse(localStorage.getItem('lapinkSession') || '{}').email);
      if (!email) return;
      var users = JSON.parse(localStorage.getItem('lapinkClients') || '[]');
      var idx = users.findIndex(function (u) { return (u.email || '').toLowerCase() === email.toLowerCase(); });
      if (idx === -1) return;
      var cpf = document.getElementById('pgCpf').value.replace(/\D/g, '');
      var cel = document.getElementById('pgCelular').value.replace(/\D/g, '');
      if (cpf) users[idx].cpf = cpf;
      if (cel) users[idx].whatsapp = cel;
      var end = {
        cep:         document.getElementById('pgCep').value.replace(/\D/g, ''),
        rua:         document.getElementById('pgRua').value.trim(),
        numero:      document.getElementById('pgNumero').value.trim(),
        complemento: document.getElementById('pgComplemento').value.trim(),
        bairro:      document.getElementById('pgBairro').value.trim(),
        cidade:      document.getElementById('pgCidade').value.trim(),
        uf:          document.getElementById('pgEstado').value.trim().toUpperCase(),
        referencia:  (users[idx].endereco && users[idx].endereco.referencia) || ''
      };
      users[idx].endereco = end; // endereço usado agora vira o padrão
      // Também guarda em "endereços salvos" (sem duplicar)
      var arr = Array.isArray(users[idx].enderecos) ? users[idx].enderecos.slice()
        : ((users[idx].endereco && users[idx].endereco.cep) ? [users[idx].endereco] : []);
      var chave = function (e) { return [(e.cep || '').replace(/\D/g, ''), (e.rua || '').toLowerCase().trim(), (e.numero || '').trim()].join('|'); };
      if (end.cep && end.rua && !arr.some(function (e) { return chave(e) === chave(end); })) arr.push(end);
      users[idx].enderecos = arr;
      localStorage.setItem('lapinkClients', JSON.stringify(users));
    } catch (e) {}
  }

  /* ── Validação de campos ────────────────────────────────── */
  function validar() {
    var campos = [
      { id: 'pgNome',    teste: function (v) { return v.length >= 3; } },
      { id: 'pgCpf',     teste: function (v) { return v.replace(/\D/g, '').length === 11; } },
      { id: 'pgCelular', teste: function (v) { return v.replace(/\D/g, '').length >= 10; } },
      { id: 'pgCep',     teste: function (v) { return v.replace(/\D/g, '').length === 8; } },
      { id: 'pgRua',     teste: function (v) { return v.length >= 2; } },
      { id: 'pgNumero',  teste: function (v) { return v.length >= 1; } },
      { id: 'pgBairro',  teste: function (v) { return v.length >= 2; } },
      { id: 'pgCidade',  teste: function (v) { return v.length >= 2; } },
      { id: 'pgEstado',  teste: function (v) { return v.length === 2; } }
    ];

    var ok = true;
    var primeiroErro = null;

    campos.forEach(function (c) {
      var el = document.getElementById(c.id);
      var val = el.value.trim();
      if (!c.teste(val)) {
        el.classList.add('err');
        if (!primeiroErro) primeiroErro = el;
        ok = false;
      } else {
        el.classList.remove('err');
      }
    });

    if (!ok && primeiroErro) {
      primeiroErro.focus();
      primeiroErro.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    return ok;
  }

  /* ── Remover classe err ao digitar ──────────────────────── */
  ['pgNome','pgCpf','pgCelular','pgCep','pgRua','pgNumero','pgBairro','pgCidade','pgEstado'].forEach(function (id) {
    var el = document.getElementById(id);
    if (el) {
      el.addEventListener('input', function () { this.classList.remove('err'); });
    }
  });

  /* ── Chamada ao Firebase Function (Mercado Pago) ─────────── */
  window.pagarComMP = async function () {
    if (!validar()) return;
    _salvarPerfilCheckout(); // guarda dados/endereço p/ próximas compras

    var cart = typeof getCart === 'function' ? getCart() : _cart;
    if (!cart.length) { location.replace('V1.html'); return; }

    // Coleta valores do form
    var nome        = document.getElementById('pgNome').value.trim();
    var cpf         = document.getElementById('pgCpf').value.replace(/\D/g, '');
    var celular     = document.getElementById('pgCelular').value.trim();
    var cep         = document.getElementById('pgCep').value.replace(/\D/g, '');
    var rua         = document.getElementById('pgRua').value.trim();
    var numero      = document.getElementById('pgNumero').value.trim();
    var complemento = document.getElementById('pgComplemento').value.trim();
    var bairro      = document.getElementById('pgBairro').value.trim();
    var cidade      = document.getElementById('pgCidade').value.trim();
    var estado      = document.getElementById('pgEstado').value.trim().toUpperCase();

    var total = _subtotal + _freteValor;

    var payload = {
      cliente: {
        nome: nome,
        email: _client.email || '',
        cpf: cpf,
        celular: celular
      },
      endereco: {
        cep: cep,
        rua: rua,
        numero: numero,
        complemento: complemento,
        bairro: bairro,
        cidade: cidade,
        estado: estado
      },
      itens: cart.map(function (i) {
        return { id: i.id, nome: i.nome, qty: i.qty, preco: i.preco };
      }),
      subtotal: _subtotal,
      frete: _freteValor,
      total: total,
      modalidadeFrete: _modalidadeSelecionada
    };

    // UI: spinner
    var btn = document.getElementById('pgBtnMP');
    btn.disabled = true;
    btn.innerHTML = '<i class="ti ti-loader-2 spin-icon" aria-hidden="true"></i> Processando...';

    try {
      var resp = await fetch(
        'https://us-central1-lapink-82a39.cloudfunctions.net/createPreference',
        {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        }
      );

      var data = await resp.json();

      if (!resp.ok) {
        throw new Error(data.error || 'Erro ao processar pagamento');
      }

      // Salvar pedido_id localmente para sucesso.html ler.
      // OBS: NÃO baixamos estoque aqui — a baixa ocorre no webhook quando o
      // pagamento é confirmado (evita "vazar" estoque se o cliente abandonar o MP).
      if (data.pedido_id) {
        localStorage.setItem('lapinkUltimoPedido', data.pedido_id);
      }
      marcarAbandonoConvertido(); // compra concluída — sai da lista de abandonados

      // Redirecionar para o Mercado Pago
      window.location.href = data.init_point;

    } catch (err) {
      // Pagamento online ainda NÃO disponível (Cloud Functions / Mercado Pago não
      // configurados). NÃO registramos pedido, NÃO baixamos estoque e NÃO limpamos
      // o carrinho — evita "venda falsa" (cliente concluir sem pagar e furar estoque).
      console.warn('[pagamento] checkout indisponível:', err && err.message);
      btn.disabled = false;
      btn.innerHTML = '<i class="ti ti-lock" aria-hidden="true"></i> Pagar com Mercado Livre';
      _mostrarErroCheckout();
    }
  };

  /* ── Aviso de pagamento indisponível (sem finalizar nada) + saída via WhatsApp ── */
  function _mostrarErroCheckout() {
    var nota = document.querySelector('.pg-security-note');
    if (nota) {
      nota.innerHTML = '<i class="ti ti-alert-triangle" aria-hidden="true" style="color:#c0392b"></i> ' +
        'Pagamento online em manutenção no momento. Seu pedido <strong>não</strong> foi cobrado. ' +
        'Conclua sua compra pelo WhatsApp — é só clicar no botão abaixo.';
      nota.style.color = '#c0392b';
    }
    // Injeta (uma vez) o botão de finalizar pelo WhatsApp logo após o botão de pagar.
    if (!document.getElementById('pgBtnWhats')) {
      var ref = document.getElementById('pgBtnMP');
      if (ref && ref.parentNode) {
        var b = document.createElement('button');
        b.id = 'pgBtnWhats';
        b.type = 'button';
        b.className = 'pg-btn-mp';
        b.style.cssText = 'background:#25D366;margin-top:10px;';
        b.innerHTML = '<i class="ti ti-brand-whatsapp" aria-hidden="true"></i> Finalizar pedido pelo WhatsApp';
        b.onclick = _pedidoWhatsApp;
        ref.parentNode.insertBefore(b, ref.nextSibling);
      }
    }
    try {
      if (typeof showToast === 'function') showToast('Pagamento indisponível agora — finalize pelo WhatsApp.', 'erro');
    } catch (e) {}
  }

  /* ── Monta o pedido e abre o WhatsApp da loja ── */
  function _pedidoWhatsApp() {
    var cart = typeof getCart === 'function' ? getCart() : _cart;
    if (!cart || !cart.length) { location.replace('V1.html'); return; }
    _salvarPerfilCheckout(); // guarda dados/endereço p/ próximas compras
    var store = {};
    try { store = JSON.parse(localStorage.getItem('lapinkStoreConfig') || '{}'); } catch (e) {}
    var wa = (store.whatsapp || '').replace(/\D/g, '');
    if (!wa) { alert('O WhatsApp da loja ainda não foi configurado. Fale com o administrador.'); return; }
    if (wa.length <= 11) wa = '55' + wa;

    var nome = (document.getElementById('pgNome').value || '').trim();
    var cep  = (document.getElementById('pgCep').value || '').trim();
    var rua  = (document.getElementById('pgRua').value || '').trim();
    var num  = (document.getElementById('pgNumero').value || '').trim();
    var bairro = (document.getElementById('pgBairro').value || '').trim();
    var cidade = (document.getElementById('pgCidade').value || '').trim();
    var uf   = (document.getElementById('pgEstado').value || '').trim();

    var linhas = cart.map(function (i) { return '• ' + i.qty + 'x ' + i.nome + ' — ' + fmtR(i.preco * i.qty); });
    var total = _subtotal + _freteValor;
    var endereco = (rua || cidade)
      ? ('\n\nEndereço: ' + [rua + (num ? ', ' + num : ''), bairro, cidade + (uf ? '/' + uf : ''), cep].filter(Boolean).join(' - '))
      : '';
    var msg = 'Olá! Quero finalizar meu pedido na LaPink 💖' + (nome ? ' (sou ' + nome + ')' : '') + '\n\n' +
              linhas.join('\n') +
              '\n\nSubtotal: ' + fmtR(_subtotal) +
              '\nFrete: ' + (_modalidadeSelecionada ? fmtR(_freteValor) : 'a combinar') +
              '\nTotal: ' + fmtR(total) +
              endereco +
              '\n\nComo faço o pagamento?';
    window.open('https://wa.me/' + wa + '?text=' + encodeURIComponent(msg), '_blank');
  }

  /* ── Baixa de estoque local (sincroniza p/ Firestore via cloud-sync) ── */
  function baixarEstoqueLocal(itens) {
    try {
      var prods = _produtos();
      var mudou = false;
      (itens || []).forEach(function (it) {
        var p = prods.find(function (x) { return String(x.id) === String(it.id); });
        if (p && typeof p.estoque !== 'undefined') {
          p.estoque = Math.max(0, (parseInt(p.estoque) || 0) - (it.qty || 1));
          mudou = true;
        }
      });
      if (mudou) localStorage.setItem('lapinkProdutos', JSON.stringify(prods));
    } catch (e) { console.warn('[pagamento] baixa estoque local falhou', e); }
  }

  /* ── Marca pedido Firestore como estoqueBaixado (evita baixa dupla no webhook) ── */
  function marcarEstoqueBaixado(pedidoId) {
    try {
      if (typeof firebase !== 'undefined' && firebase.apps.length) {
        firebase.firestore().collection('pedidos').doc(pedidoId)
          .update({ estoqueBaixado: true }).catch(function () {});
      }
    } catch (e) {}
  }

  /* ── Registra pedido em localStorage (lapinkPedidos) p/ admin + relatórios ── */
  function registrarPedidoLocal(payload) {
    try {
      var numero = 'LPK-' + Date.now().toString(36).toUpperCase() + '-' +
                   Math.random().toString(36).slice(2, 4).toUpperCase();
      var pedido = {
        id: Date.now(),
        numero: numero,
        status: 'aguardando_pagamento',
        cliente: {
          name: payload.cliente.nome,
          nome: payload.cliente.nome,
          email: payload.cliente.email,
          cpf: payload.cliente.cpf,
          whatsapp: payload.cliente.celular,
          celular: payload.cliente.celular
        },
        endereco: payload.endereco,
        itens: payload.itens,
        subtotal: payload.subtotal,
        frete: payload.frete,
        total: payload.total,
        modalidadeFrete: payload.modalidadeFrete,
        pagamento: 'mercadopago',
        rastreio: null,
        estoqueBaixado: true,
        data: new Date().toISOString()
      };
      var lista = [];
      try { lista = JSON.parse(localStorage.getItem('lapinkPedidos') || '[]'); } catch (e) {}
      lista.push(pedido);
      localStorage.setItem('lapinkPedidos', JSON.stringify(lista));
      return pedido;
    } catch (e) { console.warn('[pagamento] registrarPedidoLocal falhou', e); return null; }
  }

  /* ── Captura de carrinho abandonado (chamar no WhatsApp depois) ── */
  var _abandonoId = null;
  function salvarAbandono() {
    try {
      var cel  = (document.getElementById('pgCelular').value || '').replace(/\D/g, '');
      var nome = (document.getElementById('pgNome').value || '').trim();
      var cart = typeof getCart === 'function' ? getCart() : [];
      if (cel.length < 10 || !cart.length) return; // só com celular válido + itens
      if (!_abandonoId) _abandonoId = 'AB-' + Date.now().toString(36).toUpperCase();
      var rec = {
        id: _abandonoId,
        nome: nome,
        celular: cel,
        email: (_client && _client.email) || '',
        itens: cart.map(function (i) { return { nome: i.nome, qty: i.qty, preco: i.preco }; }),
        total: (typeof getCartTotal === 'function' ? getCartTotal() : 0),
        status: 'aberto',
        createdAt: Date.now(),
        updatedAt: Date.now()
      };
      try {
        var arr = JSON.parse(localStorage.getItem('lapinkAbandonados') || '[]');
        var i = arr.findIndex(function (x) { return x.id === _abandonoId; });
        if (i >= 0) arr[i] = rec; else arr.push(rec);
        localStorage.setItem('lapinkAbandonados', JSON.stringify(arr));
      } catch (e) {}
      try {
        if (typeof firebase !== 'undefined' && firebase.apps.length) {
          firebase.firestore().collection('abandonados').doc(_abandonoId).set(rec, { merge: true }).catch(function () {});
        }
      } catch (e) {}
    } catch (e) {}
  }
  function marcarAbandonoConvertido() {
    if (!_abandonoId) return;
    try {
      var arr = JSON.parse(localStorage.getItem('lapinkAbandonados') || '[]').filter(function (x) { return x.id !== _abandonoId; });
      localStorage.setItem('lapinkAbandonados', JSON.stringify(arr));
    } catch (e) {}
    try {
      if (typeof firebase !== 'undefined' && firebase.apps.length) {
        firebase.firestore().collection('abandonados').doc(_abandonoId).set({ status: 'convertido', updatedAt: Date.now() }, { merge: true }).catch(function () {});
      }
    } catch (e) {}
  }
  var _abTimer;
  ['pgCelular', 'pgNome'].forEach(function (id) {
    var el = document.getElementById(id);
    if (el) el.addEventListener('blur', function () { clearTimeout(_abTimer); _abTimer = setTimeout(salvarAbandono, 400); });
  });

  /* ── Init ───────────────────────────────────────────────── */
  renderItens();
  renderFrete();
  preencherDados();

})();
</script>
