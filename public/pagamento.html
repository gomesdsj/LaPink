<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Pagamento — LaPink</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#D4537E" />
<link rel="manifest" href="manifest.json" />
<link rel="stylesheet" href="css/Principal.css" />
<link rel="stylesheet" href="css/componentes.css" />
<link rel="stylesheet" href="css/PrincipalPublica.css" />
<link rel="stylesheet" href="css/public.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
<style>
body { background:var(--gray-50); min-height:100vh; }

/* ── Topo ── */
.pg-header {
  background:#fff; border-bottom:.5px solid var(--pink-100);
  padding:14px 24px; display:flex; align-items:center; gap:14px;
  position:sticky; top:0; z-index:50;
}
.pg-header-logo { font-size:20px; font-weight:900; color:var(--pink-500); letter-spacing:-.5px; text-decoration:none; }
.pg-header-back {
  margin-left:auto; display:flex; align-items:center; gap:6px;
  font-size:13px; font-weight:600; color:var(--pink-400); text-decoration:none;
  background:var(--pink-50); border:1px solid var(--pink-100); border-radius:20px;
  padding:6px 14px; transition:background .15s;
}
.pg-header-back:hover { background:var(--pink-100); }

/* ── Layout ── */
.pg-page {
  max-width:820px; margin:24px auto; padding:0 20px 80px;
  display:flex; gap:20px; align-items:flex-start;
}
.pg-left  { flex:1; min-width:0; display:flex; flex-direction:column; gap:16px; }
.pg-right { flex:0 0 300px; position:sticky; top:76px; display:flex; flex-direction:column; gap:14px; }

/* ── Cards ── */
.card {
  background:#fff; border-radius:16px; padding:20px;
  border:.5px solid var(--pink-100); box-shadow:0 1px 6px rgba(212,83,126,.06);
}
.card-title {
  font-size:11px; font-weight:700; color:var(--pink-500);
  text-transform:uppercase; letter-spacing:.07em;
  display:flex; align-items:center; gap:7px;
  padding-bottom:12px; margin-bottom:16px;
  border-bottom:.5px solid var(--pink-100);
}

/* ── Itens ── */
.pg-item {
  display:flex; align-items:center; gap:12px;
  padding:10px 0; border-bottom:.5px solid var(--pink-50);
}
.pg-item:last-child { border-bottom:none; padding-bottom:0; }
.pg-item:first-child { padding-top:0; }
.pg-item-img {
  width:56px; height:56px; border-radius:10px; flex-shrink:0;
  background:var(--pink-50); border:.5px solid var(--pink-100);
  display:flex; align-items:center; justify-content:center;
  font-size:22px; color:var(--pink-200); overflow:hidden;
}
.pg-item-img img { width:100%; height:100%; object-fit:cover; }
.pg-item-info { flex:1; min-width:0; }
.pg-item-name { font-size:13px; font-weight:700; color:var(--gray-800); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pg-item-qty  { font-size:11px; color:var(--gray-400); margin-top:2px; }
.pg-item-price{ font-size:14px; font-weight:800; color:var(--pink-500); white-space:nowrap; }

/* ── Totais ── */
.pg-totals { display:flex; flex-direction:column; gap:6px; margin-top:14px; padding-top:12px; border-top:.5px solid var(--pink-100); }
.pg-tot-row { display:flex; justify-content:space-between; font-size:12px; color:var(--gray-500); }
.pg-tot-row.bold { font-size:15px; font-weight:800; color:var(--gray-800); margin-top:4px; }
.pg-tot-row.bold span:last-child { color:var(--pink-500); }
.pg-tot-gratis { color:#2E8B5A !important; }

/* ── Formulário ── */
.pg-form-group { margin-bottom:14px; }
.pg-form-group:last-child { margin-bottom:0; }
.pg-form-group label { display:block; font-size:12px; font-weight:700; color:var(--gray-600); margin-bottom:6px; }
.pg-form-group input {
  width:100%; box-sizing:border-box; padding:11px 14px;
  border:1.5px solid var(--pink-100); border-radius:10px;
  font-size:13px; color:var(--gray-800); outline:none;
  transition:border-color .15s, box-shadow .15s;
}
.pg-form-group input:focus { border-color:var(--pink-300); box-shadow:0 0 0 3px rgba(212,83,126,.10); }
.pg-form-group input.err { border-color:#e05555; }
.req { color:#e05555; font-style:normal; }

/* ── Métodos de pagamento ── */
.pg-pay-methods { display:flex; flex-direction:column; gap:8px; }
.pg-pay-method {
  display:flex; align-items:center; gap:10px; padding:12px 14px;
  border:1.5px solid var(--pink-100); border-radius:12px; cursor:pointer;
  transition:border-color .15s, background .15s;
}
.pg-pay-method:has(input:checked) { border-color:var(--pink-300); background:var(--pink-50); }
.pg-pay-method input[type=radio] { accent-color:var(--pink-400); width:14px; height:14px; flex-shrink:0; }
.pg-pay-method-icon {
  width:32px; height:32px; border-radius:8px; flex-shrink:0;
  background:var(--pink-50); display:flex; align-items:center; justify-content:center;
  font-size:16px; color:var(--pink-500);
}
.pg-pay-method-info { flex:1; }
.pg-pay-method-label { font-size:13px; font-weight:700; color:var(--gray-800); }
.pg-pay-method-sub   { font-size:11px; color:var(--gray-400); margin-top:1px; }

/* ── Box de ação do pagamento ── */
.pg-pay-action { margin-top:16px; }

/* PIX */
.pg-pix-box {
  background:linear-gradient(135deg,#f0fdf4,#dcfce7); border:1px solid #86efac;
  border-radius:12px; padding:16px; color:#166534;
}
.pg-pix-box strong { display:flex; align-items:center; gap:6px; font-size:13px; margin-bottom:10px; }
.pg-pix-chave-row { display:flex; align-items:center; gap:8px; background:#fff; border:1px solid #86efac; border-radius:8px; padding:10px 12px; margin-bottom:8px; }
.pg-pix-chave-val { flex:1; font-size:13px; font-weight:700; color:#166534; word-break:break-all; }
.pg-pix-copy {
  flex-shrink:0; padding:6px 12px; background:#166534; color:#fff; border:none;
  border-radius:6px; font-size:12px; font-weight:700; cursor:pointer;
  display:flex; align-items:center; gap:5px; transition:background .15s;
}
.pg-pix-copy:hover { background:#14532d; }
.pg-pix-copy.copied { background:#2563eb; }
.pg-pix-tipo { font-size:11px; opacity:.75; }

/* Mercado Pago */
.pg-mp-box { text-align:center; }
.pg-mp-btn {
  display:flex; align-items:center; justify-content:center; gap:10px;
  width:100%; padding:16px; border-radius:14px; border:none; cursor:pointer;
  background:#009ee3; color:#fff; font-size:15px; font-weight:800;
  text-decoration:none; transition:background .15s, transform .1s;
}
.pg-mp-btn:hover { background:#0077b3; transform:translateY(-1px); }
.pg-mp-btn i { font-size:20px; }
.pg-mp-note { font-size:11px; color:var(--gray-400); margin-top:8px; text-align:center; }
.pg-mp-nolink { background:var(--pink-50); border:1px dashed var(--pink-200); border-radius:12px; padding:14px; text-align:center; color:var(--gray-500); font-size:12px; }

/* Transferência */
.pg-transf-box { background:var(--pink-50); border:1px solid var(--pink-100); border-radius:12px; padding:14px; font-size:13px; color:var(--gray-700); }
.pg-transf-box strong { display:block; font-size:12px; color:var(--pink-600); margin-bottom:8px; text-transform:uppercase; letter-spacing:.05em; }
.pg-transf-row { display:flex; justify-content:space-between; align-items:center; padding:4px 0; }
.pg-transf-row span:first-child { color:var(--gray-400); font-size:11px; }

/* Dinheiro */
.pg-dinheiro-box { background:#fffbeb; border:1px solid #fde68a; border-radius:12px; padding:14px; font-size:13px; color:#92400e; }
.pg-dinheiro-box i { font-size:20px; display:block; margin-bottom:6px; }

/* ── Botão confirmar ── */
.pg-btn-confirm {
  display:flex; align-items:center; justify-content:center; gap:8px;
  width:100%; padding:16px; border-radius:14px; border:none; cursor:pointer;
  background:var(--pink-500); color:#fff; font-size:15px; font-weight:800;
  transition:background .15s; margin-top:4px;
}
.pg-btn-confirm:hover { background:var(--pink-600); }
.pg-btn-confirm:disabled { opacity:.5; cursor:default; }

/* ── Badge de entrega ── */
.pg-delivery-badge {
  display:flex; align-items:center; gap:8px; padding:10px 14px;
  background:var(--pink-50); border:1px solid var(--pink-100); border-radius:10px;
  font-size:12px; color:var(--gray-600);
}
.pg-delivery-badge i { color:var(--pink-400); font-size:15px; }
.pg-delivery-badge strong { color:var(--gray-800); }

/* ── Sucesso ── */
.pg-success { display:none; text-align:center; padding:48px 20px; }
.pg-success-icon { width:72px; height:72px; border-radius:50%; background:#dcfce7; border:1px solid #86efac; display:flex; align-items:center; justify-content:center; margin:0 auto 18px; font-size:32px; color:#166534; }
.pg-success h2 { font-size:20px; font-weight:800; color:var(--gray-800); margin-bottom:8px; }
.pg-success p  { font-size:13px; color:var(--gray-400); }

/* ── Mobile ── */
@media (max-width:680px) {
  .pg-page { flex-direction:column; padding:0 14px 80px; margin-top:16px; gap:14px; }
  .pg-right { position:static; flex:none; width:100%; }
  .pg-header { padding:12px 16px; }
}
</style>
</head>
<body>
<script src="js/firebase-config.js"></script>
<script src="js/cloud-sync.js"></script>
<script src="js/cart.js"></script>

<!-- ── Cabeçalho ── -->
<header class="pg-header">
  <a href="V1.html" class="pg-header-logo">LaPink</a>
  <a href="javascript:history.back()" class="pg-header-back"><i class="ti ti-arrow-left"></i> Voltar</a>
</header>

<div class="pg-page" id="pgPage">

  <!-- ── Esquerda: itens + dados ── -->
  <div class="pg-left" id="pgLeft">

    <!-- Carrinho vazio -->
    <div class="card" id="pgEmpty" style="display:none;text-align:center;padding:48px 20px;">
      <i class="ti ti-shopping-cart" style="font-size:40px;color:var(--pink-200);display:block;margin-bottom:14px;"></i>
      <p style="color:var(--gray-400);font-size:13px;margin-bottom:18px;">Seu carrinho está vazio.</p>
      <a href="V1.html" style="display:inline-block;background:var(--pink-500);color:#fff;border-radius:12px;padding:11px 24px;font-size:14px;font-weight:700;text-decoration:none;">Ver produtos</a>
    </div>

    <!-- Itens do pedido -->
    <div class="card" id="pgItemsCard">
      <div class="card-title"><i class="ti ti-shopping-bag"></i> Itens do pedido</div>
      <div id="pgItems"><!-- JS --></div>
      <div class="pg-totals" id="pgTotals"><!-- JS --></div>
    </div>

    <!-- Dados do cliente -->
    <div class="card" id="pgFormCard">
      <div class="card-title"><i class="ti ti-user"></i> Seus dados</div>
      <div class="pg-form-group">
        <label>Nome completo <span class="req">*</span></label>
        <input type="text" id="pgNome" placeholder="Seu nome" autocomplete="name" inputmode="text" />
      </div>
      <div class="pg-form-group">
        <label>WhatsApp <span class="req">*</span></label>
        <input type="tel" id="pgWpp" placeholder="(11) 99999-9999" autocomplete="tel" inputmode="tel" />
      </div>
    </div>

  </div>

  <!-- ── Direita: entrega + pagamento + confirmar ── -->
  <div class="pg-right" id="pgRight">

    <!-- Entrega selecionada -->
    <div class="pg-delivery-badge" id="pgDeliveryBadge" style="display:none;">
      <i class="ti ti-truck-delivery"></i>
      <span id="pgDeliveryTxt">—</span>
    </div>

    <!-- Forma de pagamento -->
    <div class="card">
      <div class="card-title"><i class="ti ti-credit-card"></i> Forma de pagamento</div>
      <div class="pg-pay-methods" id="pgPayMethods"><!-- JS --></div>
      <div class="pg-pay-action" id="pgPayAction"><!-- JS --></div>
    </div>

    <!-- Confirmar -->
    <button class="pg-btn-confirm" id="pgBtnConfirm" onclick="confirmarPedido()">
      <i class="ti ti-brand-whatsapp"></i> Confirmar pedido
    </button>

    <p style="font-size:11px;color:var(--gray-400);text-align:center;margin-top:4px;">
      Ao confirmar, seu pedido é registrado e entramos em contato via WhatsApp.
    </p>

  </div>

</div>

<!-- Sucesso -->
<div class="card pg-success" id="pgSuccess" style="max-width:500px;margin:60px auto;">
  <div class="pg-success-icon"><i class="ti ti-check"></i></div>
  <h2>Pedido confirmado!</h2>
  <p id="pgSuccessMsg">Seu pedido foi registrado com sucesso.</p>
  <a href="V1.html" style="display:inline-block;margin-top:24px;background:var(--pink-500);color:#fff;border-radius:12px;padding:12px 28px;font-size:14px;font-weight:700;text-decoration:none;">Continuar comprando</a>
</div>

<script>
function _esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtR(v){ return 'R$ '+Number(v).toFixed(2).replace('.',','); }

(function(){

  // ── Configs ──────────────────────────────────────────────
  function _payCfg()  { try{return JSON.parse(localStorage.getItem('lapinkPaymentConfig')||'{}');}catch(e){return{};} }
  function _apiCfg()  { try{return JSON.parse(localStorage.getItem('lapinkApiConfig')||'{}');}catch(e){return{};} }
  function _entCfg()  { try{return JSON.parse(localStorage.getItem('lapinkEntregaConfig')||'{}');}catch(e){return{};} }
  function _storeCfg(){ try{return JSON.parse(localStorage.getItem('lapinkStoreConfig')||'{}');}catch(e){return{};} }

  // ── Entrega selecionada (salva pelo mini-cart no checkout) ──
  function _getDelivery(){
    var ship = localStorage.getItem('lapinkCartShipping');
    var cfg  = _entCfg();
    if(!ship) return null;
    var sub  = getCartTotal();
    var gA   = cfg.gratis&&cfg.gratis.ativo;
    var min  = gA?(cfg.gratis.minimo!=null?Number(cfg.gratis.minimo):300):0;
    var gratis = gA&&sub>=min;

    var MAP = {
      gratis:    { label:'Frete grátis', taxa:0, icon:'ti-sparkles' },
      retirada:  { label:'Retirada no local', taxa:0, icon:'ti-map-pin' },
      local:     { label:'Entrega local', taxa: gratis?0:(cfg.local&&cfg.local.taxa||0), icon:'ti-motorbike' },
      pac:       { label:'PAC (Correios)', taxa:0, icon:'ti-package' },
      sedex:     { label:'SEDEX (Correios)', taxa:0, icon:'ti-bolt' },
      correios:  { label:'Correios', taxa:0, icon:'ti-package' },
      acombinar: { label:'A combinar', taxa:0, icon:'ti-truck-delivery', aCombinar:true }
    };
    // Try to get price from stored config
    var base = MAP[ship]||{ label:ship, taxa:0, icon:'ti-truck-delivery' };
    // For PAC/SEDEX, look up from entrega config if available
    if((ship==='pac'||ship==='sedex')&&!gratis){
      var prods = JSON.parse(localStorage.getItem('lapinkProdutos')||'[]');
      var cart  = getCart();
      var pesoG = cart.reduce(function(s,i){
        var p=prods.find(function(x){return String(x.id)===String(i.id);});
        return s+((p&&p.pesoEnvioGramas)?p.pesoEnvioGramas*i.qty:0);
      },0);
      var tabela = ship==='pac'?(cfg.pac&&cfg.pac.tabela):(cfg.sedex&&cfg.sedex.tabela);
      if(tabela&&tabela.length&&pesoG>0){
        var ord=tabela.slice().sort(function(a,b){return a.ateG-b.ateG;});
        var row=ord.find(function(r){return pesoG<=r.ateG;});
        if(row) base.taxa=row.preco;
      }
    }
    return base;
  }

  // ── Métodos de pagamento disponíveis ──────────────────────
  var _PAY_META = {
    pix:     { icon:'ti-qrcode',       label:'PIX',                     sub:'Pagamento instantâneo' },
    cartao:  { icon:'ti-credit-card',  label:'Cartão de crédito/débito', sub:'Maquininha na entrega ou Mercado Pago' },
    transf:  { icon:'ti-building-bank',label:'Transferência bancária',   sub:'Transferência bancária' },
    dinheiro:{ icon:'ti-cash',         label:'Dinheiro / na entrega',    sub:'Pagamento na entrega'  }
  };

  function getPayOpts(){
    var c=_payCfg(); var opts=[];
    ['pix','cartao','transf','dinheiro'].forEach(function(k){
      var m=c[k];
      if(m&&m.ativo){ var meta=_PAY_META[k]; opts.push({key:k,icon:meta.icon,label:meta.label,sub:meta.sub}); }
    });
    if(!opts.length) opts.push({key:'outro',icon:'ti-cash',label:'Pagamento',sub:'A combinar com o vendedor'});
    return opts;
  }

  // ── Estado ────────────────────────────────────────────────
  var _selPay = localStorage.getItem('lapinkCartPayment') || '';

  // ── Renderizar itens ──────────────────────────────────────
  function renderItems(){
    var cart=getCart();
    var el=document.getElementById('pgItems');
    var totEl=document.getElementById('pgTotals');
    if(!cart.length){
      document.getElementById('pgEmpty').style.display='';
      document.getElementById('pgItemsCard').style.display='none';
      document.getElementById('pgFormCard').style.display='none';
      document.getElementById('pgRight').style.display='none';
      return false;
    }

    var prods=JSON.parse(localStorage.getItem('lapinkProdutos')||'[]');
    el.innerHTML=cart.map(function(item){
      var p=prods.find(function(x){return String(x.id)===String(item.id);});
      var img=p&&p.imagem
        ?'<img src="'+_esc(item.imagem)+'" alt="'+_esc(item.nome)+'" />'
        :'<i class="ti ti-diamond"></i>';
      return '<div class="pg-item">' +
        '<div class="pg-item-img">'+img+'</div>' +
        '<div class="pg-item-info">' +
          '<div class="pg-item-name">'+_esc(item.nome)+'</div>' +
          '<div class="pg-item-qty">Qtd: '+item.qty+'</div>' +
        '</div>' +
        '<div class="pg-item-price">'+fmtR(item.preco*item.qty)+'</div>' +
      '</div>';
    }).join('');

    var sub=getCartTotal();
    var delivery=_getDelivery();
    var frete=delivery&&!delivery.aCombinar?(delivery.taxa||0):0;
    var total=sub+frete;
    var freteHtml=delivery
      ?('<span class="pg-tot-row">' +
        '<span>Frete</span>' +
        '<span'+(delivery.aCombinar?' style="color:#888"':frete===0?' class="pg-tot-gratis"':'')+'>'+
          (delivery.aCombinar?'A combinar':frete===0?'Grátis':fmtR(frete))+'</span>' +
        '</span>')
      :'';
    totEl.innerHTML=
      '<span class="pg-tot-row"><span>Subtotal</span><span>'+fmtR(sub)+'</span></span>' +
      freteHtml +
      '<span class="pg-tot-row bold"><span>Total</span><span>'+fmtR(total)+'</span></span>';
    return true;
  }

  // ── Entrega badge ─────────────────────────────────────────
  function renderDelivery(){
    var delivery=_getDelivery();
    var badge=document.getElementById('pgDeliveryBadge');
    var txt=document.getElementById('pgDeliveryTxt');
    if(!badge||!txt) return;
    if(delivery){
      badge.style.display='flex';
      var priceStr=delivery.aCombinar?'A combinar':delivery.taxa===0?'<strong style="color:#2E8B5A">Grátis</strong>':'<strong>'+fmtR(delivery.taxa)+'</strong>';
      txt.innerHTML='<strong>'+_esc(delivery.label)+'</strong>&nbsp;·&nbsp;'+priceStr;
    } else {
      badge.style.display='none';
    }
  }

  // ── Render métodos de pagamento ───────────────────────────
  function renderPayMethods(){
    var opts=getPayOpts();
    var saved=localStorage.getItem('lapinkCartPayment')||'';
    if(!saved||!opts.find(function(o){return o.key===saved;})) saved=opts[0]&&opts[0].key||'';
    _selPay=saved;

    document.getElementById('pgPayMethods').innerHTML=opts.map(function(o){
      return '<label class="pg-pay-method">' +
        '<input type="radio" name="pgPay" value="'+o.key+'"'+(o.key===_selPay?' checked':'')+
          ' onchange="selectPay(\''+o.key+'\')" />' +
        '<div class="pg-pay-method-icon"><i class="ti '+o.icon+'"></i></div>' +
        '<div class="pg-pay-method-info">' +
          '<div class="pg-pay-method-label">'+_esc(o.label)+'</div>' +
          '<div class="pg-pay-method-sub">'+_esc(o.sub)+'</div>' +
        '</div>' +
      '</label>';
    }).join('');

    renderPayAction();
  }

  // ── Ação de pagamento por método ──────────────────────────
  function renderPayAction(){
    var el=document.getElementById('pgPayAction');
    if(!el) return;
    var cfg=_payCfg(); var api=_apiCfg();
    var k=_selPay; var html='';

    if(k==='pix'&&cfg.pix&&cfg.pix.chave){
      var tipoLabel={cpf:'CPF',cnpj:'CNPJ',email:'E-mail',telefone:'Telefone',aleatoria:'Chave aleatória'}[cfg.pix.tipoChave]||'Chave PIX';
      html='<div class="pg-pix-box">' +
        '<strong><i class="ti ti-qrcode"></i> Pagar via PIX</strong>' +
        '<div class="pg-pix-tipo">Tipo: '+_esc(tipoLabel)+(cfg.pix.nomeFavorecido?' · '+_esc(cfg.pix.nomeFavorecido):'')+' </div>' +
        '<div class="pg-pix-chave-row" style="margin-top:10px;">' +
          '<span class="pg-pix-chave-val">'+_esc(cfg.pix.chave)+'</span>' +
          '<button class="pg-pix-copy" id="pg-copy-btn" onclick="copiarPix()"><i class="ti ti-copy"></i> Copiar</button>' +
        '</div>' +
        (cfg.pix.instrucao?'<p style="font-size:12px;margin-top:6px;">'+_esc(cfg.pix.instrucao)+'</p>':'') +
      '</div>';

    } else if(k==='cartao'){
      var mpLink=api.mpPaymentLink||'';
      if(mpLink){
        html='<div class="pg-mp-box">' +
          '<a href="'+_esc(mpLink)+'" target="_blank" rel="noopener" class="pg-mp-btn">' +
            '<i class="ti ti-credit-card"></i> Pagar com Mercado Pago' +
          '</a>' +
          '<p class="pg-mp-note">Você será redirecionado ao ambiente seguro do Mercado Pago.</p>' +
        '</div>';
      } else {
        html='<div class="pg-mp-nolink">' +
          '<i class="ti ti-credit-card" style="font-size:22px;display:block;margin-bottom:6px;color:var(--pink-300);"></i>' +
          'Pagamento via maquininha no momento da entrega' +
          (cfg.cartao&&cfg.cartao.parcelaMax>1?'<br><strong>Parcelamento em até '+cfg.cartao.parcelaMax+'x sem juros</strong>':'') +
        '</div>';
      }

    } else if(k==='transf'&&cfg.transferencia){
      var t=cfg.transferencia;
      html='<div class="pg-transf-box">' +
        '<strong><i class="ti ti-building-bank"></i> Dados para transferência</strong>' +
        (t.banco?'<div class="pg-transf-row"><span>Banco</span><strong>'+_esc(t.banco)+'</strong></div>':'') +
        (t.agencia?'<div class="pg-transf-row"><span>Agência</span><strong>'+_esc(t.agencia)+'</strong></div>':'') +
        (t.conta?'<div class="pg-transf-row"><span>Conta</span><strong>'+_esc(t.conta)+'</strong></div>':'') +
        (t.favorecido?'<div class="pg-transf-row"><span>Favorecido</span><strong>'+_esc(t.favorecido)+'</strong></div>':'') +
        (t.instrucao?'<p style="font-size:12px;margin-top:8px;color:#555;">'+_esc(t.instrucao)+'</p>':'') +
      '</div>';

    } else if(k==='dinheiro'&&cfg.dinheiro){
      html='<div class="pg-dinheiro-box">' +
        '<i class="ti ti-cash"></i>' +
        '<strong>Pagamento na entrega</strong>' +
        '<p style="margin-top:6px;font-size:12px;">'+_esc(cfg.dinheiro.instrucao||'Pagamento no momento da entrega ou retirada.')+'</p>' +
      '</div>';

    } else {
      html='<div class="pg-mp-nolink">Pagamento a combinar com o vendedor.</div>';
    }

    el.innerHTML=html;
  }

  // ── Expõe ─────────────────────────────────────────────────
  window.selectPay=function(k){
    _selPay=k;
    localStorage.setItem('lapinkCartPayment',k);
    renderPayAction();
  };

  window.copiarPix=function(){
    var cfg=_payCfg();
    if(!cfg.pix||!cfg.pix.chave) return;
    navigator.clipboard.writeText(cfg.pix.chave).then(function(){
      var btn=document.getElementById('pg-copy-btn');
      if(btn){ btn.innerHTML='<i class="ti ti-check"></i> Copiado!'; btn.classList.add('copied'); }
      setTimeout(function(){ if(btn){ btn.innerHTML='<i class="ti ti-copy"></i> Copiar'; btn.classList.remove('copied'); } },2000);
    }).catch(function(){
      var ta=document.createElement('textarea');
      ta.value=cfg.pix.chave; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    });
  };

  // ── Confirmar pedido ──────────────────────────────────────
  window.confirmarPedido=function(){
    var nome=document.getElementById('pgNome').value.trim();
    var wpp=document.getElementById('pgWpp').value.trim();
    var ok=true;
    if(!nome){ document.getElementById('pgNome').classList.add('err'); ok=false; }
    else document.getElementById('pgNome').classList.remove('err');
    if(!wpp){ document.getElementById('pgWpp').classList.add('err'); ok=false; }
    else document.getElementById('pgWpp').classList.remove('err');
    if(!ok){ document.getElementById('pgNome').focus(); return; }

    var cart=getCart();
    if(!cart.length){ alert('Seu carrinho está vazio.'); return; }

    var delivery=_getDelivery();
    var sub=getCartTotal();
    var frete=delivery&&!delivery.aCombinar?(delivery.taxa||0):0;
    var total=sub+frete;

    var sc=_storeCfg();
    var lojaWpp=(sc.whatsapp||'').replace(/\D/g,'');
    if(!lojaWpp){ alert('WhatsApp da loja não configurado. Peça ao administrador.'); return; }

    // Salvar pedido
    var numPedido=(function(){
      try{
        var n=parseInt(localStorage.getItem('lapinkPedidoCounter')||'0')+1;
        localStorage.setItem('lapinkPedidoCounter',String(n));
        return String(n).padStart(4,'0');
      }catch(e){return 'N/A';}
    })();

    var payOpts=getPayOpts();
    var payLabel=(payOpts.find(function(o){return o.key===_selPay;})||{label:''}).label;

    var pedido={
      numero:numPedido, cliente:nome, whatsapp:wpp,
      itens:cart.map(function(i){return{nome:i.nome,qty:i.qty,preco:i.preco};}),
      subtotal:sub, frete:frete,
      entrega:delivery?delivery.label:'A combinar',
      pagamento:payLabel, total:total,
      status:'aguardando', data:new Date().toISOString()
    };
    try{
      var pedidos=JSON.parse(localStorage.getItem('lapinkPedidos')||'[]');
      pedidos.unshift(pedido);
      localStorage.setItem('lapinkPedidos',JSON.stringify(pedidos));
    }catch(e){}

    // Baixar estoque
    try{
      var prods=JSON.parse(localStorage.getItem('lapinkProdutos')||'[]');
      cart.forEach(function(item){
        var idx=prods.findIndex(function(p){return String(p.id)===String(item.id);});
        if(idx>=0) prods[idx].estoque=Math.max(0,(Number(prods[idx].estoque)||0)-item.qty);
      });
      localStorage.setItem('lapinkProdutos',JSON.stringify(prods));
    }catch(e){}

    // Montar mensagem WhatsApp
    var itensMsg=cart.map(function(i){return '- '+i.nome+' x'+i.qty+' — '+fmtR(i.preco*i.qty);}).join('\n');
    var delivLine=delivery
      ?('*Entrega:* '+delivery.label+(delivery.aCombinar?' — A combinar':frete===0?' — Grátis':' — '+fmtR(frete))+'\n')
      :'';
    var msg=
      '*Novo Pedido LaPink* 🛍\n' +
      '*Nº:* '+numPedido+'\n' +
      '*Data:* '+new Date().toLocaleDateString('pt-BR')+'\n\n' +
      '*Cliente:* '+nome+'\n' +
      '*WhatsApp:* '+wpp+'\n\n' +
      '*Itens:*\n'+itensMsg+'\n\n' +
      '*Subtotal:* '+fmtR(sub)+'\n' +
      delivLine+
      '*Total:* '+fmtR(total)+'\n' +
      (payLabel?'*Pagamento:* '+payLabel+'\n':'') +
      '\n_Status: Aguardando confirmação_';

    clearCart();
    localStorage.removeItem('lapinkCartPayment');
    localStorage.removeItem('lapinkCartShipping');

    document.getElementById('pgPage').style.display='none';
    var suc=document.getElementById('pgSuccess');
    suc.style.display='block';
    document.getElementById('pgSuccessMsg').innerHTML=
      'Pedido <strong>'+numPedido+'</strong> registrado!<br>Sua mensagem foi aberta no WhatsApp.';

    var waUrl='https://wa.me/'+lojaWpp+'?text='+encodeURIComponent(msg);
    setTimeout(function(){ window.open(waUrl,'_blank'); },300);
  };

  // ── Pré-preencher dados salvos ────────────────────────────
  function preencherDados(){
    try{
      var u=JSON.parse(localStorage.getItem('lapinkSession')||'null');
      if(u){ if(u.nome) document.getElementById('pgNome').value=u.nome; if(u.whatsapp) document.getElementById('pgWpp').value=u.whatsapp; }
    }catch(e){}
  }

  // ── Init ──────────────────────────────────────────────────
  var ok=renderItems();
  if(ok){
    renderDelivery();
    renderPayMethods();
    preencherDados();
  }

})();
</script>
</body>
</html>
