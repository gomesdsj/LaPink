<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Acesse sua conta LaPink." />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#D4537E" />
<title>LaPink — Login</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="assets/images/icon-192.png" type="image/png" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" href="css/Principal.css" />
<link rel="stylesheet" href="css/componentes.css" />
<link rel="stylesheet" href="css/PrincipalPublica.css" />
<link rel="stylesheet" href="css/public.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
<style>
  .auth-card-icon {
    width: 52px; height: 52px; border-radius: var(--radius-lg);
    background: var(--pink-50); color: var(--pink-500);
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; margin: 0 auto 20px;
  }
  .auth-card h1 { text-align: center; font-size: 22px; font-weight: 800; color: var(--gray-800); margin-bottom: 4px; }
  .auth-card > p { text-align: center; }

  .input-icon-wrap { position: relative; }
  .input-icon-wrap input { padding-left: 40px !important; }
  .input-icon-wrap .inp-icon {
    position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
    font-size: 15px; color: var(--gray-400); pointer-events: none;
  }
  .input-icon-wrap .toggle-pw {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    font-size: 15px; color: var(--gray-400); background: none; border: none;
    cursor: pointer; padding: 2px; line-height: 1;
  }
  .input-icon-wrap .toggle-pw:hover { color: var(--pink-500); }
</style>
</head>
<body class="auth-background">
  <a class="skip-link" href="#loginForm">Pular para o formulário</a>

  <header class="store-nav">
    <a class="store-logo" href="index.html" aria-label="LaPink — início">
      <i class="ti ti-diamond" aria-hidden="true"></i>
      <span class="logo-name">LaPink</span>
    </a>
    <div class="nav-actions">
      <button class="nav-admin-btn" onclick="location.href='index.html'" type="button">
        <i class="ti ti-arrow-left"></i> Voltar
      </button>
    </div>
  </header>

  <section class="store-section auth-page">
    <article class="card auth-card">
      <div class="auth-card-icon" aria-hidden="true">
        <i class="ti ti-user-circle"></i>
      </div>
      <h1>Entrar</h1>
      <p>Acesse seus pedidos e informações da conta.</p>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="login-email">E-mail</label>
          <div class="input-icon-wrap">
            <i class="ti ti-mail inp-icon" aria-hidden="true"></i>
            <input id="login-email" type="email" placeholder="email@dominio.com"
                   autocomplete="email" required />
          </div>
        </div>
        <div class="form-group">
          <label for="login-password">Senha</label>
          <div class="input-icon-wrap">
            <i class="ti ti-lock inp-icon" aria-hidden="true"></i>
            <input id="login-password" type="password" placeholder="••••••••"
                   autocomplete="current-password" required />
            <button type="button" class="toggle-pw" onclick="togglePw()"
                    aria-label="Mostrar ou ocultar senha">
              <i class="ti ti-eye"></i>
            </button>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-full">Entrar</button>
        </div>
        <div class="form-message" id="loginMessage" role="alert" aria-live="polite"></div>
      </form>

      <p class="auth-footer-text">Não tem conta? <a href="register.html">Cadastre-se</a></p>

      <div style="margin-top:18px;text-align:center;border-top:1px solid var(--gray-200);padding-top:16px;">
        <a href="../admin/login.html" style="display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--gray-400);text-decoration:none;padding:8px 18px;border:1px solid var(--gray-200);border-radius:var(--radius-full);transition:all .15s;" onmouseover="this.style.color='var(--pink-500)';this.style.borderColor='var(--pink-300)'" onmouseout="this.style.color='var(--gray-400)';this.style.borderColor='var(--gray-200)'">
          <i class="ti ti-layout-dashboard"></i> Acesso Administrador
        </a>
      </div>
    </article>
  </section>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-init.js"></script>
  <script src="js/cloud-sync.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/login.js"></script>
  <script>
    function togglePw() {
      var inp = document.getElementById('login-password');
      var icon = document.querySelector('.toggle-pw i');
      var isText = inp.type === 'text';
      inp.type = isText ? 'password' : 'text';
      icon.className = isText ? 'ti ti-eye' : 'ti ti-eye-off';
    }
  </script>
</body>
</html>
