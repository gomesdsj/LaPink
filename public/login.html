<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bella Joias — Login</title>
<link rel="stylesheet" href="../css/Principal.css" />
<link rel="stylesheet" href="../css/componentes.css" />
<link rel="stylesheet" href="../css/PrincipalPublica.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
<style>
  .auth-card { max-width: 420px; width:100%; margin:auto; padding:28px; }
  .auth-card h2 { margin-bottom:16px; }
  .form-message { margin-top:14px; font-weight:600; }
</style>
</head>
<body>
  <header class="store-nav">
    <a class="store-logo" href="index.html" style="display:flex;align-items:center;gap:8px;"><i class="ti ti-diamond"></i><span class="logo-name">Bella Joias</span></a>
    <div class="nav-actions" style="gap:12px;">
      <button class="btn btn-secondary" onclick="location.href='register.html'">Cadastre-se</button>
      <button class="nav-admin-btn" onclick="location.href='index.html'">Voltar</button>
    </div>
  </header>

  <section class="store-section" style="min-height:calc(100vh - 90px); display:flex; align-items:center; justify-content:center; padding:40px 20px;">
    <article class="card auth-card">
      <h2>Login</h2>
      <p>Entre com seu e-mail e senha para acessar.</p>
      <form id="loginForm">
        <div class="form-group">
          <label for="login-email">E-mail</label>
          <input id="login-email" type="email" placeholder="email@dominio.com" required />
        </div>
        <div class="form-group">
          <label for="login-password">Senha</label>
          <input id="login-password" type="password" placeholder="Sua senha" required />
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-full">Entrar</button>
        </div>
        <div class="form-message" id="loginMessage"></div>
      </form>
      <p style="margin-top:18px; text-align:center;">Não tem conta? <a href="register.html">Cadastre-se</a></p>
    </article>
  </section>

  <script>
    const STORAGE_KEY = 'lapinkClients';
    const loginForm = document.getElementById('loginForm');
    const loginMessage = document.getElementById('loginMessage');

    function getClients() {
      return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    }

    function setMessage(text, success = false) {
      loginMessage.textContent = text;
      loginMessage.style.color = success ? '#1e7e34' : '#c82333';
    }

    loginForm.addEventListener('submit', event => {
      event.preventDefault();
      const email = document.getElementById('login-email').value.trim().toLowerCase();
      const password = document.getElementById('login-password').value;
      const clients = getClients();
      const client = clients.find(user => user.email === email && user.password === password);
      if (!client) {
        setMessage('E-mail ou senha incorretos.', false);
        return;
      }
      localStorage.setItem('lapinkLoggedClient', JSON.stringify(client));
      setMessage('Login realizado com sucesso! Redirecionando...', true);
      setTimeout(() => location.href = 'index.html', 1200);
    });
  </script>
</body>
</html>
