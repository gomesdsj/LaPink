<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Crie sua conta LaPink e compre semijoias com facilidade." />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#D4537E" />
<title>LaPink — Cadastro</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="assets/icon.svg?v=2" type="image/svg+xml" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" href="css/Principal.css" />
<link rel="stylesheet" href="css/componentes.css" />
<link rel="stylesheet" href="css/PrincipalPublica.css" />
<link rel="stylesheet" href="css/public.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.45.0/dist/tabler-icons.min.css" />
<style>
  .auth-card-icon {
    width: 56px; height: 56px; border-radius: var(--radius-lg);
    background: var(--pink-50); color: var(--pink-500);
    display: flex; align-items: center; justify-content: center;
    font-size: 25px; margin: 0 auto 20px;
    box-shadow: 0 6px 18px rgba(153,53,86,.12);
  }
  .auth-card h1 { text-align: center; font-size: 23px; font-weight: 800; color: var(--gray-800); margin-bottom: 4px; }
  .auth-card > p { text-align: center; }

  .input-icon-wrap { position: relative; }
  .input-icon-wrap input { padding-left: 40px !important; }
  .input-icon-wrap .inp-icon {
    position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
    font-size: 15px; color: var(--gray-400); pointer-events: none;
  }
  .input-icon-wrap .toggle-pw {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    font-size: 15px; color: var(--gray-400); background: none; border: none;
    cursor: pointer; padding: 2px; line-height: 1;
  }
  .input-icon-wrap .toggle-pw:hover { color: var(--pink-500); }

  /* Caixa de consentimento (Política de Privacidade / Termos de Uso) —
     tratada como um pequeno cartão em vez de checkbox solto no formulário. */
  .consent-box {
    display: flex; align-items: flex-start; gap: 10px;
    background: var(--gray-50); border: .5px solid var(--gray-200);
    border-radius: var(--radius-md); padding: 12px 14px;
    margin-bottom: 16px;
  }
  .consent-box input[type="checkbox"] {
    width: 16px; height: 16px; margin-top: 2px; flex-shrink: 0;
    accent-color: var(--pink-500);
  }
  .consent-box label {
    font-size: 12.5px; font-weight: 400; color: var(--gray-600);
    line-height: 1.5;
  }
  .consent-box label a { color: var(--pink-500); font-weight: 600; text-decoration: underline; }
  .consent-box label a:hover { color: var(--pink-600); }
</style>
</head>
<body class="auth-background">
  <a class="skip-link" href="#registerForm">Pular para o formulário</a>

  <header class="store-nav">
    <a class="store-logo" href="index.html" aria-label="LaPink — início">
      <i class="ti ti-butterfly" aria-hidden="true"></i>
      <span class="logo-name">LaPink</span>
    </a>
    <div class="nav-actions">
      <button class="nav-admin-btn" onclick="location.href='index.html'" type="button">
        <i class="ti ti-arrow-left"></i> Voltar
      </button>
    </div>
  </header>

  <section class="store-section auth-page">
    <article class="card auth-card">
      <div class="auth-card-icon" aria-hidden="true">
        <i class="ti ti-user-plus"></i>
      </div>
      <h1>Cadastro</h1>
      <p>Abra sua conta para gerenciar pedidos e acessar ofertas exclusivas.</p>

      <form id="registerForm" novalidate>
        <div class="form-group">
          <label for="register-name">Nome completo</label>
          <div class="input-icon-wrap">
            <i class="ti ti-user inp-icon" aria-hidden="true"></i>
            <input id="register-name" type="text" placeholder="Nome completo"
                   autocomplete="name" required />
          </div>
        </div>
        <div class="form-group">
          <label for="register-email">E-mail</label>
          <div class="input-icon-wrap">
            <i class="ti ti-mail inp-icon" aria-hidden="true"></i>
            <input id="register-email" type="email" placeholder="email@dominio.com"
                   autocomplete="email" required />
          </div>
        </div>
        <div class="form-group">
          <label for="register-whatsapp">WhatsApp</label>
          <div class="input-icon-wrap">
            <i class="ti ti-brand-whatsapp inp-icon" aria-hidden="true"></i>
            <input id="register-whatsapp" type="tel" placeholder="(11) 99999-9999"
                   autocomplete="tel" required />
          </div>
        </div>
        <div class="form-group">
          <label for="register-password">Senha</label>
          <div class="input-icon-wrap">
            <i class="ti ti-lock inp-icon" aria-hidden="true"></i>
            <input id="register-password" type="password" placeholder="Mínimo 6 caracteres"
                   autocomplete="new-password" required minlength="6" />
            <button type="button" class="toggle-pw" onclick="togglePw('register-password', this)"
                    aria-label="Mostrar ou ocultar senha">
              <i class="ti ti-eye"></i>
            </button>
          </div>
        </div>
        <div class="form-group">
          <label for="register-password-confirm">Confirmar senha</label>
          <div class="input-icon-wrap">
            <i class="ti ti-lock-check inp-icon" aria-hidden="true"></i>
            <input id="register-password-confirm" type="password" placeholder="Repita a senha"
                   autocomplete="new-password" required />
            <button type="button" class="toggle-pw" onclick="togglePw('register-password-confirm', this)"
                    aria-label="Mostrar ou ocultar confirmação de senha">
              <i class="ti ti-eye"></i>
            </button>
          </div>
        </div>
        <div class="consent-box">
          <input type="checkbox" id="register-aceite" required />
          <label for="register-aceite">
            Li e aceito a
            <a href="privacidade.html" target="_blank" rel="noopener">Política de Privacidade</a>
            e os
            <a href="termos.html" target="_blank" rel="noopener">Termos de Uso</a>
            da LaPink.
          </label>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-full">Criar conta</button>
        </div>
        <div class="form-message" id="registerMessage" role="alert" aria-live="polite"></div>
      </form>

      <p class="auth-footer-text">Já tem conta? <a href="login.html">Entrar</a></p>
    </article>
  </section>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-init.js"></script>
  <script src="js/cloud-sync.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/email-boas-vindas.js"></script>
  <script src="js/register.js"></script>
  <script>
    function togglePw(inputId, btn) {
      var inp = document.getElementById(inputId);
      var icon = btn.querySelector('i');
      var isText = inp.type === 'text';
      inp.type = isText ? 'password' : 'text';
      icon.className = isText ? 'ti ti-eye' : 'ti ti-eye-off';
    }
  </script>
</body>
</html>
