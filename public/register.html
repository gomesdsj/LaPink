<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Crie sua conta LaPink e compre semijoias com facilidade." />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#D4537E" />
<title>LaPink — Cadastro</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="assets/images/icon-192.png" type="image/png" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" href="css/Principal.css" />
<link rel="stylesheet" href="css/componentes.css" />
<link rel="stylesheet" href="css/PrincipalPublica.css" />
<link rel="stylesheet" href="css/public.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
</head>
<body class="auth-background">
  <a class="skip-link" href="#registerForm">Pular para o formulário</a>

  <header class="store-nav">
    <a class="store-logo" href="index.html" aria-label="LaPink — início">
      <i class="ti ti-diamond" aria-hidden="true"></i>
      <span class="logo-name">LaPink</span>
    </a>
    <div class="nav-actions">
      <button class="nav-admin-btn" onclick="location.href='index.html'" type="button"><i class="ti ti-arrow-left"></i> Voltar</button>
    </div>
  </header>

  <section class="store-section auth-page">
    <article class="card auth-card">
      <h1>Cadastro</h1>
      <p>Abra sua conta para gerenciar pedidos e acessar ofertas exclusivas.</p>
      <form id="registerForm" novalidate>
        <div class="form-group">
          <label for="register-name">Nome completo</label>
          <input id="register-name" type="text" placeholder="Nome completo" autocomplete="name" required />
        </div>
        <div class="form-group">
          <label for="register-email">E-mail</label>
          <input id="register-email" type="email" placeholder="email@dominio.com" autocomplete="email" required />
        </div>
        <div class="form-group">
          <label for="register-whatsapp">WhatsApp</label>
          <input id="register-whatsapp" type="tel" placeholder="(11) 99999-9999" autocomplete="tel" required />
        </div>
        <div class="form-group">
          <label for="register-password">Senha</label>
          <input id="register-password" type="password" placeholder="Mínimo 6 caracteres" autocomplete="new-password" required minlength="6" />
        </div>
        <div class="form-group">
          <label for="register-password-confirm">Confirmar senha</label>
          <input id="register-password-confirm" type="password" placeholder="Repita a senha" autocomplete="new-password" required />
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-full">Cadastrar</button>
        </div>
        <div class="form-message" id="registerMessage" role="alert" aria-live="polite"></div>
      </form>
      <p class="auth-footer-text">Já tem conta? <a href="login.html">Entre</a></p>
    </article>
  </section>

  <script src="js/storage.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
