<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bella Joias — Cadastro</title>
<link rel="stylesheet" href="../css/Principal.css" />
<link rel="stylesheet" href="../css/componentes.css" />
<link rel="stylesheet" href="../css/PrincipalPublica.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
<style>
  .auth-card { max-width: 520px; width:100%; margin:auto; padding:28px; }
  .auth-card h2 { margin-bottom:16px; }
  .form-message { margin-top:14px; font-weight:600; }
</style>
</head>
<body>
  <header class="store-nav">
    <a class="store-logo" href="index.html" style="display:flex;align-items:center;gap:8px;"><i class="ti ti-diamond"></i><span class="logo-name">Bella Joias</span></a>
    <div class="nav-actions" style="gap:12px;">
      <button class="btn btn-secondary" onclick="location.href='login.html'">Entrar</button>
      <button class="nav-admin-btn" onclick="location.href='index.html'">Voltar</button>
    </div>
  </header>

  <section class="store-section" style="min-height:calc(100vh - 90px); display:flex; align-items:center; justify-content:center; padding:40px 20px;">
    <article class="card auth-card">
      <h2>Cadastro</h2>
      <p>Abra sua conta para gerenciar pedidos e acessar ofertas exclusivas.</p>
      <form id="registerForm">
        <div class="form-group">
          <label for="register-name">Nome completo</label>
          <input id="register-name" type="text" placeholder="Nome completo" required />
        </div>
        <div class="form-group">
          <label for="register-email">E-mail</label>
          <input id="register-email" type="email" placeholder="email@dominio.com" required />
        </div>
        <div class="form-group">
          <label for="register-whatsapp">WhatsApp</label>
          <input id="register-whatsapp" type="tel" placeholder="(11) 99999-9999" required />
        </div>
        <div class="form-group">
          <label for="register-password">Senha</label>
          <input id="register-password" type="password" placeholder="Senha" required />
        </div>
        <div class="form-group">
          <label for="register-password-confirm">Confirmar senha</label>
          <input id="register-password-confirm" type="password" placeholder="Repita a senha" required />
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-full">Cadastrar</button>
        </div>
        <div class="form-message" id="registerMessage"></div>
      </form>
      <p style="margin-top:18px; text-align:center;">Já tem conta? <a href="login.html">Entre</a></p>
    </article>
  </section>

  <script>
    const STORAGE_KEY = 'lapinkClients';
    const registerForm = document.getElementById('registerForm');
    const registerMessage = document.getElementById('registerMessage');

    function getClients() {
      return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    }

    function saveClients(clients) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(clients));
    }

    function setMessage(text, success = false) {
      registerMessage.textContent = text;
      registerMessage.style.color = success ? '#1e7e34' : '#c82333';
    }

    registerForm.addEventListener('submit', event => {
      event.preventDefault();
      const name = document.getElementById('register-name').value.trim();
      const email = document.getElementById('register-email').value.trim().toLowerCase();
      const whatsapp = document.getElementById('register-whatsapp').value.trim();
      const password = document.getElementById('register-password').value;
      const confirm = document.getElementById('register-password-confirm').value;
      if (!name || !email || !whatsapp || !password || !confirm) {
        setMessage('Preencha todos os campos.', false);
        return;
      }
      if (password !== confirm) {
        setMessage('As senhas não conferem.', false);
        return;
      }
      const clients = getClients();
      if (clients.some(client => client.email === email)) {
        setMessage('Este e-mail já está cadastrado.', false);
        return;
      }
      clients.push({
        name,
        email,
        whatsapp,
        password,
        totalSpent: 0,
        purchases: [],
      });
      saveClients(clients);
      setMessage('Cadastro realizado com sucesso! Redirecionando para login...', true);
      setTimeout(() => location.href = 'login.html', 1200);
    });
  </script>
</body>
</html>
