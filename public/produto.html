<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Produto — LaPink</title>
<meta name="description" content="LaPink — Semijoias e acessórios banhados a ouro de qualidade. Compre online com segurança." />
<meta property="og:type" content="product" />
<meta property="og:site_name" content="LaPink" />
<meta property="og:image" content="https://lapink-82a39.web.app/public/assets/icon.svg" id="og-image" />
<meta property="og:url" content="" id="og-url" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="theme-color" content="#D4537E" />
<link rel="manifest" href="manifest.json" />
<link rel="stylesheet" href="css/Principal.css" />
<link rel="stylesheet" href="css/componentes.css" />
<link rel="stylesheet" href="css/PrincipalPublica.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.45.0/tabler-icons.min.css" />
<style>
.product-page { max-width: 900px; margin: 40px auto; padding: 0 20px; }
.product-layout { display: flex; gap: 40px; align-items: flex-start; flex-wrap: wrap; }
.product-img-wrap {
  flex: 0 0 340px;
  height: 340px;
  background: var(--pink-50, #fff0f5);
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 80px;
  color: #D4537E;
  overflow: hidden;
}
.product-img-wrap img { width: 100%; height: 100%; object-fit: cover; border-radius: 16px; }
.product-gallery { flex: 0 0 340px; display: flex; flex-direction: column; gap: 10px; }
.product-thumbs { display: flex; gap: 8px; }
.product-thumb {
  width: 60px; height: 60px; border-radius: 10px; overflow: hidden;
  border: 2px solid transparent; cursor: pointer; background: var(--pink-50, #fff0f5);
  padding: 0; flex: 0 0 auto; transition: border-color .18s;
}
.product-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.product-thumb.active { border-color: #D4537E; }
@media (max-width: 600px) { .product-gallery, .product-img-wrap { flex-basis: 100%; width: 100%; } }
.product-info { flex: 1; min-width: 260px; }
.product-cat {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: #D4537E;
  margin-bottom: 8px;
}
.product-name { font-size: 26px; font-weight: 800; color: #1a1a2e; margin-bottom: 10px; line-height: 1.2; }
.product-code { font-size: 11px; color: #aaa; font-family: monospace; margin-bottom: 16px; }
.product-desc { font-size: 14px; color: #555; line-height: 1.6; margin-bottom: 20px; }
.product-price-main { font-size: 28px; font-weight: 800; color: #D4537E; margin-bottom: 4px; }
.product-price-atacado { font-size: 13px; color: #888; margin-bottom: 4px; }
.product-stock { font-size: 13px; color: #666; margin-bottom: 20px; display: flex; align-items: center; gap: 6px; }
.product-stock.low { color: #c0392b; }
.btn-buy-full {
  display: block;
  width: 100%;
  background: #D4537E;
  color: #fff;
  border: none;
  border-radius: 30px;
  padding: 14px 0;
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
  letter-spacing: .03em;
  transition: background .18s;
  margin-bottom: 10px;
}
.btn-buy-full:hover { background: #b93d65; }
.btn-back-loja {
  display: block;
  width: 100%;
  text-align: center;
  background: #fff;
  color: #D4537E;
  border: 1.5px solid #D4537E;
  border-radius: 30px;
  padding: 12px 0;
  font-size: 14px;
  font-weight: 700;
  text-decoration: none;
  transition: background .18s;
}
.btn-back-loja:hover { background: #fff0f5; }
.product-not-found {
  text-align: center;
  padding: 80px 20px;
  color: #aaa;
}
.product-not-found i { font-size: 60px; display: block; margin-bottom: 16px; }
.product-not-found a { color: #D4537E; font-weight: 700; }
</style>
</head>
<body>

<header class="store-nav">
  <a class="store-logo" href="V1.html" aria-label="LaPink — início">
    <i class="ti ti-diamond" aria-hidden="true"></i>
    <span class="logo-name">LaPink</span>
  </a>
  <div class="nav-actions">
    <a class="section-link" href="V1.html">
      <i class="ti ti-arrow-left"></i> Voltar à loja
    </a>
    <a class="cart-nav-btn" href="checkout.html" title="Carrinho" style="position:relative;display:inline-flex;align-items:center;gap:4px;color:var(--pink-500,#993556);font-weight:700;text-decoration:none;font-size:14px;padding:6px 10px;border-radius:8px;">
      <i class="ti ti-shopping-cart"></i>
      <span class="cart-badge" style="display:none;position:absolute;top:-4px;right:-4px;background:#D4537E;color:#fff;border-radius:50%;width:18px;height:18px;font-size:10px;font-weight:800;align-items:center;justify-content:center;">0</span>
    </a>
    <button class="btn btn-secondary nav-text-btn" onclick="location.href='login.html'" type="button">Entrar</button>
    <button class="nav-admin-btn nav-text-btn" onclick="location.href='../admin/admin.html'" type="button" style="display:none" id="panelBtn">Painel</button>
  </div>
</header>

<nav aria-label="Navegação" style="max-width:900px;margin:16px auto 0;padding:0 20px;font-size:12px;color:#B08898;">
  <a href="V1.html" style="color:#D4537E;text-decoration:none;font-weight:600;">Loja</a>
  <span aria-hidden="true" style="margin:0 6px;">›</span>
  <span id="breadcrumb-nome">Produto</span>
</nav>
<div class="product-page" id="product-page">
  <div class="product-not-found" id="not-found" style="display:none;">
    <i class="ti ti-mood-empty"></i>
    Produto não encontrado.<br>
    <a href="V1.html">Ver todos os produtos</a>
  </div>
  <div class="product-layout" id="product-layout" style="display:none;">
    <div class="product-gallery">
      <div class="product-img-wrap" id="prod-img-wrap">
        <i class="ti ti-diamond" id="prod-icon"></i>
        <img id="prod-img" src="" alt="" style="display:none;" />
      </div>
      <div class="product-thumbs" id="prod-thumbs" style="display:none;"></div>
    </div>
    <div class="product-info">
      <div class="product-cat" id="prod-cat">—</div>
      <h1 class="product-name" id="prod-name">—</h1>
      <div class="product-code" id="prod-code"></div>
      <p class="product-desc" id="prod-desc"></p>
      <div class="product-price-main" id="prod-price">—</div>
      <div class="product-price-atacado" id="prod-atacado"></div>
      <div class="product-stock" id="prod-stock"><i class="ti ti-stack" aria-hidden="true"></i> <span id="prod-stock-txt">—</span></div>
      <div class="product-frete-info" id="prod-frete-info" style="display:none;font-size:12px;color:#B08898;margin-top:8px;display:flex;align-items:center;gap:5px;">
        <i class="ti ti-truck-delivery" aria-hidden="true" style="color:#D4537E;"></i>
        <span id="prod-frete-txt"></span>
      </div>
      <button class="btn-buy-full" id="btn-comprar" type="button">
        <i class="ti ti-shopping-cart" aria-hidden="true"></i> Adicionar ao carrinho
      </button>
      <a href="V1.html" class="btn-back-loja">Ver mais produtos</a>
    </div>
  </div>
</div>

<script>
(function() {
  function getProdutos() {
    try { return JSON.parse(localStorage.getItem('lapinkProdutos') || '[]'); } catch(e) { return []; }
  }

  // Escapa para uso seguro em atributos/HTML (produtos têm escrita pública → anti-XSS)
  function esc(v) {
    return String(v == null ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  var params  = new URLSearchParams(window.location.search);
  var idParam = params.get('id');
  var nomePar = params.get('nome');

  var produtos = getProdutos();
  var produto  = null;

  if (idParam) {
    produto = produtos.find(function(p) { return String(p.id) === String(idParam); });
  }
  if (!produto && nomePar) {
    var nLower = nomePar.toLowerCase();
    produto = produtos.find(function(p) { return (p.nome||'').toLowerCase() === nLower; });
  }

  if (!produto) {
    document.getElementById('not-found').style.display = '';
    // 1º acesso sem cache: o catálogo pode chegar do Firestore depois do load.
    // Recarrega uma vez quando os produtos sincronizarem, para achar a peça.
    document.addEventListener('lapinkProdutosAtualizados', function _recarregar() {
      document.removeEventListener('lapinkProdutosAtualizados', _recarregar);
      location.reload();
    });
    return;
  }

  // Atualiza metadados
  document.title = produto.nome + ' — LaPink';
  var bcNome = document.getElementById('breadcrumb-nome');
  if (bcNome) bcNome.textContent = produto.nome;
  var ogUrl = document.getElementById('og-url');
  var ogImg = document.getElementById('og-image');
  if (ogUrl) ogUrl.setAttribute('content', window.location.href);
  if (ogImg && produto.imagem) ogImg.setAttribute('content', produto.imagem);
  var descMeta = document.querySelector('meta[name="description"]');
  if (descMeta && produto.descricao) descMeta.setAttribute('content', produto.descricao.slice(0, 160));

  // Imagem(ns) — galeria com até 3 fotos
  var _imgs = (Array.isArray(produto.imagens) && produto.imagens.length) ? produto.imagens : (produto.imagem ? [produto.imagem] : []);
  var prodImgEl = document.getElementById('prod-img');
  if (_imgs.length) {
    prodImgEl.src = _imgs[0];
    prodImgEl.alt = produto.nome;
    prodImgEl.style.display = 'block';
    document.getElementById('prod-icon').style.display = 'none';

    var thumbsEl = document.getElementById('prod-thumbs');
    if (_imgs.length > 1) {
      thumbsEl.style.display = 'flex';
      thumbsEl.innerHTML = _imgs.map(function(src, i) {
        return '<button type="button" class="product-thumb' + (i === 0 ? ' active' : '') + '" data-src="' + esc(src) + '">' +
          '<img src="' + esc(src) + '" alt="' + esc(produto.nome || '') + ' foto ' + (i + 1) + '" loading="lazy" /></button>';
      }).join('');
      thumbsEl.addEventListener('click', function(ev) {
        var btn = ev.target.closest('.product-thumb');
        if (!btn) return;
        prodImgEl.src = btn.getAttribute('data-src');
        thumbsEl.querySelectorAll('.product-thumb').forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
      });
    }
  } else {
    document.getElementById('prod-icon').className = 'ti ' + (produto.icone || 'ti-diamond');
  }

  // Texto
  document.getElementById('prod-cat').textContent   = produto.categoria || '';
  document.getElementById('prod-name').textContent  = produto.nome || '';
  document.getElementById('prod-code').textContent  = produto.codigoPeca ? 'Cód. #' + produto.codigoPeca : '';
  document.getElementById('prod-desc').textContent  = produto.descricao || '';

  var preco = Number(produto.precoAtacado) || Number(produto.precoVarejo) || 0;
  var est   = parseInt(produto.estoque)    || 0;

  document.getElementById('prod-price').textContent   = 'R$ ' + preco.toFixed(2).replace('.', ',');
  document.getElementById('prod-atacado').textContent = 'Preço de atacado';

  var stockEl = document.getElementById('prod-stock');
  var stockTx = document.getElementById('prod-stock-txt');
  if (est <= 0) {
    stockTx.textContent = 'Fora de estoque';
    stockEl.classList.add('low');
    document.getElementById('btn-comprar').disabled = true;
    document.getElementById('btn-comprar').textContent = 'Fora de estoque';
  } else if (est <= 5) {
    stockTx.textContent = 'Últimas ' + est + ' unidades!';
    stockEl.classList.add('low');
  } else {
    stockTx.textContent = est + ' unidades disponíveis';
  }

  document.getElementById('product-layout').style.display = 'flex';

  // Schema.org JSON-LD para SEO
  var ld = {
    '@context': 'https://schema.org',
    '@type': 'Product',
    'name': produto.nome,
    'description': produto.descricao || '',
    'category': produto.categoria || '',
    'offers': {
      '@type': 'Offer',
      'priceCurrency': 'BRL',
      'price': preco.toFixed(2),
      'availability': est > 0 ? 'https://schema.org/InStock' : 'https://schema.org/OutOfStock',
      'seller': { '@type': 'Organization', 'name': 'LaPink' }
    }
  };
  if (produto.imagem) ld['image'] = produto.imagem;
  if (produto.codigoPeca) ld['sku'] = produto.codigoPeca;
  var ldScript = document.createElement('script');
  ldScript.type = 'application/ld+json';
  ldScript.textContent = JSON.stringify(ld);
  document.head.appendChild(ldScript);

  // Adiciona botão "Ver carrinho / Finalizar" após o btn-back-loja
  var btnBack = document.querySelector('.btn-back-loja');
  if (btnBack) {
    var checkoutLink = document.createElement('a');
    checkoutLink.href = 'pagamento.html';
    checkoutLink.className = 'btn-checkout-link';
    checkoutLink.style.cssText = 'display:block;width:100%;text-align:center;background:#993556;color:#fff;border-radius:30px;padding:12px 0;font-size:14px;font-weight:700;text-decoration:none;margin-top:8px;';
    checkoutLink.innerHTML = '<i class="ti ti-shopping-cart"></i> Ver carrinho / Finalizar';
    btnBack.insertAdjacentElement('afterend', checkoutLink);
  }

  // Estimativa de frete
  (function() {
    try {
      var cfg = JSON.parse(localStorage.getItem('lapinkEntregaConfig') || '{}');
      var freteEl = document.getElementById('prod-frete-info');
      var freteTxt = document.getElementById('prod-frete-txt');
      if (!freteEl || !freteTxt) return;
      var linhas = [];
      if (cfg.gratis && cfg.gratis.ativo) {
        var min = cfg.gratis.minimo != null ? Number(cfg.gratis.minimo) : 300;
        linhas.push('Frete grátis acima de R$ ' + min.toFixed(2).replace('.', ','));
      }
      if (cfg.retirada && cfg.retirada.ativo) linhas.push('Retirada na loja disponível');
      if (cfg.pac && cfg.pac.ativo) linhas.push('PAC disponível');
      if (cfg.sedex && cfg.sedex.ativo) linhas.push('SEDEX disponível');
      if (cfg.local && cfg.local.ativo) linhas.push('Entrega local disponível');
      if (linhas.length) {
        freteTxt.textContent = linhas[0] + (linhas.length > 1 ? ' · ' + linhas.slice(1).join(' · ') : '');
        freteEl.style.display = 'flex';
      }
    } catch(e) {}
  })();

  // Botão comprar
  document.getElementById('btn-comprar').addEventListener('click', function() {
    if (produto.estoque <= 0) return;
    var res = addToCart(produto, 1);
    var btn = document.getElementById('btn-comprar');
    if (res && res.added <= 0) {
      btn.textContent = 'Estoque máximo no carrinho';
      btn.style.background = '#c0392b';
    } else if (res && res.capped) {
      btn.textContent = '✓ Adicionado (limite do estoque)';
      btn.style.background = '#2E8B5A';
    } else {
      btn.textContent = '✓ Adicionado ao carrinho!';
      btn.style.background = '#2E8B5A';
    }
    setTimeout(function() {
      btn.innerHTML = '<i class="ti ti-shopping-cart"></i> Adicionar ao carrinho';
      btn.style.background = '';
    }, 2000);
  });
})();
</script>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-init.js"></script>
<script src="js/cloud-sync.js"></script>
<script src="js/cart.js"></script>
<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
